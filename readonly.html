<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ระบบติดตามงานและรายงานสถานะแม่พิมพ์</title>

<!-- PWA -->
<link rel="manifest" href="manifest-readonly.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ดูสถานะแม่พิมพ์">

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
:root{
  --font:'PSL Text','PSLText','Sarabun','Segoe UI',Arial,sans-serif;
  --bg:#f0f2f7;--bg2:#fff;--bg3:#f5f6fa;
  --surface:#e8ecf5;--surface2:#dde2ef;
  --border:rgba(50,70,140,.10);--border2:rgba(50,70,140,.18);
  --accent:#2563eb;--accent2:#1d4ed8;--accent-lt:#eff5ff;
  --text:#1a1f35;--text2:#505880;--text3:#9099bc;
  --green:#16a34a;--green-lt:#f0faf4;
  --red:#dc2626;--red-lt:#fff1f1;
  --amber:#b45309;--amber-lt:#fffbeb;
  --purple:#7c3aed;--purple-lt:#f5f3ff;
  --shadow-lg:0 4px 24px rgba(20,40,100,.13);
  --r:8px;--r2:12px;--r3:16px;
}
html[data-theme="dark"]{
  --bg:#0f1220;--bg2:#1b2032;--bg3:#20263a;
  --surface:#262c42;--surface2:#333a54;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --accent:#3b82f6;--accent2:#7fb0ff;--accent-lt:rgba(37,99,235,.18);
  --text:#e8ebf5;--text2:#b6bdda;--text3:#7b83a8;
  --green:#4ade80;--green-lt:rgba(22,163,74,.18);
  --red:#f87171;--red-lt:rgba(220,38,38,.18);
  --amber:#fbbf24;--amber-lt:rgba(180,83,9,.22);
  --purple:#a78bfa;--purple-lt:rgba(124,58,237,.20);
}
body{font-family:var(--font);font-size:15px;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .15s,color .15s}

/* TOPBAR */
.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 var(--border)}
.logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;color:var(--text);white-space:nowrap}
.logo svg{color:var(--accent)}
.ro-badge{display:flex;align-items:center;gap:6px;padding:4px 12px;background:var(--accent-lt);color:var(--accent2);border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.topbar-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.meta-ts{font-size:12px;color:var(--text3);white-space:nowrap}
.icon-btn{width:36px;height:36px;border:1px solid var(--border2);background:var(--surface);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;transition:.15s;flex-shrink:0}
.icon-btn:hover{background:var(--surface2);color:var(--accent)}

/* TOOLBAR */
.toolbar{padding:11px 18px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:160px;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-input{width:100%;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:15px;padding:8px 12px 8px 34px;outline:none;font-family:var(--font);transition:.15s}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-lt)}
.sel-drop{background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;padding:8px 10px;outline:none;cursor:pointer;font-family:var(--font)}
.fmt-toggle{display:flex;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r);overflow:hidden;flex-shrink:0}
.fmt-toggle button{padding:7px 14px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.12s}
.fmt-toggle button.on.pdf{background:var(--red);color:#fff}
.fmt-toggle button.on.xls{background:var(--green);color:#fff}
.tbar-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:1.5px solid;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:.15s;white-space:nowrap;background:var(--bg2)}
.tbar-btn.exp{color:var(--red);border-color:rgba(220,38,38,.28);background:var(--red-lt)}
.tbar-btn.exp.xls{color:var(--green);border-color:rgba(22,163,74,.28);background:var(--green-lt)}
.tbar-btn.line{color:var(--green);border-color:var(--green)}
.tbar-btn.line:hover{background:var(--green-lt)}
.tbar-btn:disabled{opacity:.4;cursor:not-allowed}

/* LINE TEXT PANEL */
.line-box{display:none;margin:0 18px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:12px 14px;font-size:12.5px;font-family:'Courier New',monospace;white-space:pre-wrap;line-height:1.6;color:var(--text)}
.line-box.on{display:block}
.line-actions{display:flex;gap:8px;margin-top:10px}
.line-copy-btn{padding:6px 14px;border-radius:6px;border:1.5px solid var(--green);background:var(--green-lt);color:var(--green);font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--font)}

/* CONTENT */
.main{display:flex;flex:1;overflow:hidden;height:calc(100vh - 56px - 42px)}

/* DATASET TABS */
.dataset-tabs{display:flex;gap:2px;padding:0 20px;background:var(--bg2);border-bottom:1px solid var(--border)}
.ds-tab{padding:11px 16px;border:none;background:transparent;color:var(--text2);font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--font);border-bottom:2.5px solid transparent;transition:.15s}
.ds-tab:hover{color:var(--text)}
.ds-tab.on{color:var(--accent2);border-bottom-color:var(--accent)}
@media(max-width:768px){
  .dataset-tabs{padding:0 8px}
  .ds-tab{flex:1;padding:10px 6px;font-size:12.5px;text-align:center}
}
.content{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tbl-wrap{flex:1;overflow:auto;background:var(--bg3)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
thead tr{background:var(--bg2);border-bottom:2px solid var(--border2);position:sticky;top:0;z-index:10}
th{padding:11px 14px;text-align:left;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--text3);white-space:nowrap;font-family:var(--font)}
tbody tr{border-bottom:1px solid var(--border);background:var(--bg2);transition:background .08s}
tbody tr:nth-child(even){background:var(--bg3)}
tbody tr:hover{background:var(--accent-lt)!important}
td{padding:9px 14px;vertical-align:middle}
.chk{cursor:pointer}
.tc{font-family:'Courier New',monospace;font-size:14.5px;color:var(--accent2);font-weight:700;white-space:nowrap}
.tn{color:var(--text);line-height:1.45;max-width:420px}
.nm{font-size:14.5px;font-weight:500;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.4px;padding:2px 8px;border-radius:5px;background:var(--red-lt);color:var(--red);border:1.5px solid rgba(220,38,38,.20);white-space:nowrap;flex-shrink:0;line-height:1.4}
.tu{font-size:13px;color:var(--text2);white-space:nowrap;text-align:center}
.qb{display:inline-flex;align-items:center;justify-content:center;min-width:54px;padding:3px 10px;border-radius:6px;font-size:13px;font-weight:700;font-family:'Courier New',monospace;white-space:nowrap}
.q0{background:var(--red-lt);color:var(--red);border:1.5px solid rgba(220,38,38,.18)}
.ql{background:var(--amber-lt);color:var(--amber);border:1.5px solid rgba(180,83,9,.18)}
.qg{background:var(--green-lt);color:var(--green);border:1.5px solid rgba(22,163,74,.18)}
.qn{background:var(--surface);color:var(--text3);border:1.5px solid var(--border2)}
.qp{background:var(--purple-lt);color:var(--purple);border:1.5px solid rgba(124,58,237,.18)}
.td-date{font-size:12px;color:var(--text3);white-space:nowrap;font-family:'Courier New',monospace}
mark{background:rgba(37,99,235,.20);color:var(--accent2);border-radius:3px;padding:0 2px}

.empty{padding:70px 20px;text-align:center;color:var(--text3);background:var(--bg3)}
.empty svg{margin-bottom:13px;opacity:.3}
.empty .et{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:7px}
.empty .es{font-size:14px;line-height:1.6}

.pager{padding:11px 18px;border-top:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pinfo{font-size:13px;color:var(--text2);flex:1}
.pinfo b{color:var(--text)}
.pbtns{display:flex;gap:3px}
.pb{background:var(--surface);border:1.5px solid var(--border2);color:var(--text2);font-size:13px;padding:5px 11px;border-radius:6px;cursor:pointer;font-family:var(--font);transition:.12s}
.pb:hover:not(:disabled){background:var(--surface2);color:var(--text)}
.pb.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.pb:disabled{opacity:.3;cursor:default}

.toast{position:fixed;bottom:20px;right:20px;z-index:999;background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r2);padding:12px 16px;font-size:14px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);transform:translateY(60px);opacity:0;transition:.26s;max-width:340px;color:var(--text)}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg3)}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px}

@media(max-width:768px){
  body{font-size:14px}
  .topbar{padding:0 10px;gap:6px}
  .logo span{font-size:0}
  .ro-badge{padding:6px;border-radius:50%}
  .ro-badge span{display:none}
  .meta-ts{display:none}
  .topbar-r{gap:5px}
  .toolbar{padding:9px 12px}
  .search-input{font-size:16px;min-height:42px}
  .sel-drop{flex:1 1 100%;order:3;min-height:40px}
  .fmt-toggle button{padding:9px 12px;min-height:40px}
  .tbar-btn{padding:9px 12px;min-height:40px}

  /* TABLE -> compact stacked cards (generic label:value layout) */
  .tbl-wrap{overflow-x:hidden}
  table{min-width:0}
  thead{display:none}
  tbody,#dataTable{display:block;width:100%}
  tbody tr{display:block;padding:10px 12px;border-bottom:1px solid var(--border);position:relative}
  tbody tr:nth-child(even){background:var(--bg3)}
  td{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:3px 0;border:none;min-width:0;font-size:13px}
  td:first-child{position:absolute;top:10px;right:12px;padding:0}
  td:first-child::before{content:none}
  td::before{content:attr(data-label);color:var(--text3);font-size:11px;font-weight:600;flex-shrink:0;padding-top:1px}
  td.tc{font-family:'Courier New',monospace;color:var(--accent2);font-weight:700}
  td.tn{white-space:normal;text-align:right;max-width:65%;margin-left:auto}
  tbody tr{padding-right:40px}

  .pager{padding:10px 12px}
  .pinfo{flex:1 1 100%;order:1;text-align:center;font-size:12.5px}
  .pbtns{order:2;flex:1;justify-content:center;flex-wrap:wrap}
  .pb{min-width:38px;min-height:38px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
    <span>ระบบติดตามงานและรายงานสถานะแม่พิมพ์</span>
  </div>
  <div class="ro-badge">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg><span>read only version</span>
  </div>
  <div class="topbar-r">
    <span class="meta-ts" id="metaTs"></span>
    <div class="icon-btn" onclick="loadData()" title="รีเฟรชข้อมูล">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </div>
    <div class="icon-btn" onclick="toggleTheme()" title="สลับธีม">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </div>
  </div>
</div>

<!-- DATASET TABS -->
<div class="dataset-tabs" id="datasetTabs">
  <button class="ds-tab on" id="tab-jobs" onclick="switchTab('jobs')">งานปัจจุบัน</button>
  <button class="ds-tab" id="tab-registry" onclick="switchTab('registry')">ทะเบียนแม่พิมพ์หลัก</button>
</div>

<div class="main">
  <div class="content">
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="searchInput" type="text" placeholder="ค้นหารหัส รุ่น หรือรายละเอียด..." oninput="onFilter()" autocomplete="off">
      </div>
      <select class="sel-drop" id="stockFilter" onchange="onFilter()"></select>
      <select class="sel-drop" id="categoryFilter" onchange="onFilter()">
        <option value="">ทุกหมวด</option>
      </select>
      <div class="fmt-toggle" id="fmtToggle">
        <button class="on pdf" data-fmt="pdf" onclick="setFmt('pdf')">PDF</button>
        <button data-fmt="xls" onclick="setFmt('xls')">Excel</button>
      </div>
      <button class="tbar-btn exp" id="exportBtn" onclick="doExport()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span id="exportBtnLabel">Export PDF</span>
      </button>
      <button class="tbar-btn line" id="lineBtn" onclick="toggleLineBox()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span id="lineBtnLabel">คัดลอกข้อความ (0)</span>
      </button>
    </div>

    <div class="line-box" id="lineBox">
      <div id="lineText"></div>
      <div class="line-actions">
        <button class="line-copy-btn" onclick="copyLineText()">คัดลอกข้อความ</button>
      </div>
    </div>

    <div class="tbl-wrap" id="tblWrap">
      <div class="empty" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <div class="et">ยังไม่มีข้อมูล</div>
        <div class="es">ยังไม่พบข้อมูลในเครื่องนี้<br>กรุณาอัพโหลดไฟล์จากระบบแอดมินก่อน แล้วกดรีเฟรชอีกครั้ง</div>
      </div>
      <table id="dataTable" style="display:none">
        <thead id="tblHead"></thead>
        <tbody id="tblBody"></tbody>
      </table>
    </div>

    <div class="pager" id="pager" style="display:none">
      <div class="pinfo" id="pInfo"></div>
      <div class="pbtns" id="pBtns"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── STATE
var activeTab='jobs';
var jobsData=[], registryData=[];
var VIEW=[];
var page=1, pageSize=50;
var fmt='pdf';
var selected=new Set();
var IDB_NAME='mold_tracker_idb', IDB_STORE='kv';
var registryFetched=false;

// ── THEME
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeIcon').innerHTML=t==='dark'
    ?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    :'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  try{localStorage.setItem('stock_ro_theme',t);}catch(e){}
}
function toggleTheme(){
  applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
}
(function(){
  var saved='light';
  try{saved=localStorage.getItem('stock_ro_theme')||'light';}catch(e){}
  applyTheme(saved);
})();

// ══════════════════════════════════════════
// ── STATUS LOGIC
// ══════════════════════════════════════════
function statusOfJobs(r){
  var res=(r.result||'').toLowerCase();
  var tri=(r.trial||'').toLowerCase();
  if(res.indexOf('ng')>=0 || tri.indexOf('ng')>=0) return 'ng';
  if(res==='ok') return 'ok';
  if(res.indexOf('รอสรุปผล')>=0 || tri.indexOf('รอสรุปผล')>=0) return 'pending';
  if(!r.proto && !r.mold) return 'notstarted';
  return 'inprogress';
}
function statusOfRegistry(r){
  var res=(r.result||'').toLowerCase();
  if(res.indexOf('ng')>=0) return 'ng';
  if(res==='ok') return 'ok';
  return 'blank';
}
function statusOf(r){ return TAB_CONFIG[activeTab].statusOf(r); }
var STATUS_LABEL={ok:'OK',ng:'NG',pending:'รอสรุปผล',notstarted:'ยังไม่เริ่ม',inprogress:'กำลังดำเนินการ',blank:'ยังไม่มีผล'};
var STATUS_CLASS={ok:'qg',ng:'q0',pending:'ql',notstarted:'qn',inprogress:'qp',blank:'qn'};

// ══════════════════════════════════════════
// ── TAB CONFIG
// ══════════════════════════════════════════
var TAB_CONFIG={
  jobs:{
    statusOf: statusOfJobs,
    statusOptions:[
      {value:'all',label:'ทั้งหมด'},{value:'ok',label:'OK'},{value:'ng',label:'NG'},
      {value:'pending',label:'รอสรุปผล'},{value:'notstarted',label:'ยังไม่เริ่ม'}
    ],
    searchGet:function(r){return [r.code,r.name,r.category,r.model,r.subModel,r.owner].join(' ');},

// ── LOCAL CACHE (IndexedDB) — instant paint + offline fallback, refreshed from Cloud
function idbOpen(cb){
  var req=indexedDB.open(IDB_NAME,1);
  req.onupgradeneeded=function(e){
    var db=e.target.result;
    if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
  };
  req.onsuccess=function(e){cb(null,e.target.result);};
  req.onerror=function(e){cb(e.target.error,null);};
}
function loadLocalCache(){
  ['jobs','registry'].forEach(function(tab){
    idbOpen(function(err,db){
      if(err) return;
      var tx=db.transaction(IDB_STORE,'readonly');
      var st=tx.objectStore(IDB_STORE);
      var res={};
      var r1=st.get(tab+'_data'); r1.onsuccess=function(e){res.data=e.target.result;};
      var r2=st.get(tab+'_meta'); r2.onsuccess=function(e){res.meta=e.target.result;};
      tx.oncomplete=function(){
        db.close();
        if(res.data&&res.data.length){
          if(tab==='jobs') jobsData=res.data; else registryData=res.data;
          if(tab===activeTab){
            var m=res.meta||{};
            document.getElementById('metaTs').textContent=m.ts?('ข้อมูลจากแคช · '+new Date(m.ts).toLocaleString('th-TH')):'';
            selected=new Set(); page=1; buildCategoryOptions(); onFilter();
          }
        }
      };
    });
  });
}
function cacheSave(tab,data,meta){
  idbOpen(function(err,db){
    if(err) return;
    var tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(data,tab+'_data');
    tx.objectStore(IDB_STORE).put(meta,tab+'_meta');
    tx.oncomplete=function(){db.close();};
  });
}

// ── CLOUD LOAD (Firestore, public read — see the Firebase module script below)
function loadData(){
  var tab=activeTab;
  var loadFn = tab==='jobs' ? window.fbLoadMoldJobs : window.fbLoadMoldRegistry;
  if(typeof loadFn!=='function'){toast('ยังเชื่อมต่อ Cloud ไม่ได้ ลองรีเฟรชอีกครั้ง','err');return;}
  loadFn().then(function(res){
    if(!res.data||!res.data.length){
      if(tab==='jobs') jobsData=[]; else registryData=[];
      if(tab===activeTab && !( (tab==='jobs'?jobsData:registryData).length )) renderEmpty();
      toast('ยังไม่พบข้อมูลบน Cloud','err');
      return;
    }
    if(tab==='jobs') jobsData=res.data; else registryData=res.data;
    if(tab===activeTab){
      document.getElementById('metaTs').textContent=res.ts?('อัพเดตล่าสุด '+new Date(res.ts).toLocaleString('th-TH')):'';
      selected=new Set();
      page=1;
      buildCategoryOptions();
      onFilter();
      toast('โหลดข้อมูลล่าสุดแล้ว — '+res.data.length.toLocaleString()+' รายการ','ok');
    }
    cacheSave(tab,res.data,{ts:res.ts});
  }).catch(function(err){
    console.warn('cloud load failed',err);
    toast('โหลดจาก Cloud ไม่สำเร็จ — แสดงข้อมูลจากแคชล่าสุดแทน','err');
  });
}

// ── FILTER
function onFilter(){
  var DB = activeTab==='jobs'?jobsData:registryData;
  var tokens=document.getElementById('searchInput').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var f=document.getElementById('stockFilter').value;
  var cat=document.getElementById('categoryFilter').value;
  var cfg=TAB_CONFIG[activeTab];
  var d=DB.slice();
  if(f!=='all') d=d.filter(function(r){return statusOf(r)===f;});
  if(cat) d=d.filter(function(r){return r.category===cat;});
  if(tokens.length) d=d.filter(function(r){
    var hay=(cfg.searchGet(r)||'').toLowerCase();
    return tokens.every(function(t){return hay.includes(t);});
  });
  VIEW=d; page=1;
  renderTable(tokens); renderPager(); updateSelUI();
}
function hl(text,tokens){
  text=text||'';
  if(!tokens||!tokens.length||!text) return text;
  var pat=tokens.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|');
  return text.replace(new RegExp('('+pat+')','gi'),'<mark>$1</mark>');
}

function renderEmpty(){
  jobsData=activeTab==='jobs'?[]:jobsData;
  registryData=activeTab==='registry'?[]:registryData;
  VIEW=[];
  document.getElementById('dataTable').style.display='none';
  document.getElementById('emptyState').style.display='';

function renderTable(tokens){
  tokens=tokens||[];
  var DB = activeTab==='jobs'?jobsData:registryData;
  var cols=TAB_CONFIG[activeTab].columns;
  var body=document.getElementById('tblBody');
  var slice=VIEW.slice((page-1)*pageSize, page*pageSize);
  document.getElementById('dataTable').style.display=DB.length?'':'none';
  document.getElementById('emptyState').style.display=DB.length?'none':'';
  if(!DB.length) return;
  if(!slice.length){body.innerHTML='<tr><td colspan="'+(cols.length+1)+'" style="text-align:center;padding:48px;color:var(--text3);font-size:15px">ไม่พบรายการที่ตรงกัน</td></tr>';return;}
  body.innerHTML=slice.map(function(r){
    var st=statusOf(r);
    var checked=selected.has(r.code)?'checked':'';
    var cells='<td><input type="checkbox" class="chk row-chk" data-code="'+r.code+'" '+checked+' onclick="toggleRow(\''+String(r.code).replace(/'/g,"\\'")+'\')"></td>'
      +cols.map(function(c){
        var cls=c.tdClass?(' class="'+c.tdClass+'"'):'';
        var align=c.center?' style="text-align:center"':'';
        if(c.statusBadge) return '<td data-label="'+c.label+'"'+align+'><span class="qb '+STATUS_CLASS[st]+'">'+STATUS_LABEL[st]+'</span></td>';
        var val=c.get(r)||'';
        var titleAttr=c.titleAttr?(' title="'+String(val).replace(/"/g,'&quot;')+'"'):'';
        return '<td data-label="'+c.label+'"'+cls+titleAttr+'>'+hl(val,tokens)+'</td>';
      }).join('');
    return '<tr>'+cells+'</tr>';
  }).join('');
}
function renderPager(){
  var total=VIEW.length;
  var pages=Math.max(1,Math.ceil(total/pageSize));
  var s=total?(page-1)*pageSize+1:0, e=Math.min(page*pageSize,total);
  var DB = activeTab==='jobs'?jobsData:registryData;
  document.getElementById('pager').style.display=(DB.length&&total>0)?'':'none';
  document.getElementById('pInfo').innerHTML='แสดง <b>'+s.toLocaleString()+'–'+e.toLocaleString()+'</b> จาก <b>'+total.toLocaleString()+'</b> รายการ';
  var nums=[];
  if(pages<=7){for(var i=1;i<=pages;i++) nums.push(i);}
  else{nums.push(1);if(page>3)nums.push('…');for(var i=Math.max(2,page-1);i<=Math.min(pages-1,page+1);i++)nums.push(i);if(page<pages-2)nums.push('…');nums.push(pages);}
  var h='<button class="pb" onclick="goPage('+(page-1)+')" '+(page<=1?'disabled':'')+'>‹</button>';
  nums.forEach(function(n){if(n==='…')h+='<span class="pb" style="opacity:.4;cursor:default">…</span>';else h+='<button class="pb'+(n===page?' on':'')+'" onclick="goPage('+n+')">'+n+'</button>';});
  h+='<button class="pb" onclick="goPage('+(page+1)+')" '+(page>=pages?'disabled':'')+'>›</button>';
  document.getElementById('pBtns').innerHTML=h;
}
function goPage(p){var tp=Math.ceil(VIEW.length/pageSize);if(p<1||p>tp)return;page=p;document.getElementById('tblWrap').scrollTop=0;renderTable(document.getElementById('searchInput').value.trim().toLowerCase().split(/\s+/).filter(Boolean));renderPager();updateSelUI();}

function toggleSelAll(el){

  t.innerHTML=ico+msg; t.className='toast '+(type==='ok'?'ok':'err');
  requestAnimationFrame(function(){requestAnimationFrame(function(){t.classList.add('show');});});
  setTimeout(function(){t.classList.remove('show');},3400);
}

    });
  });
}
