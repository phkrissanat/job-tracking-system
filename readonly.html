<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MIS - ระบบสารสนเทศเพื่อการจัดการ</title>

<!-- PWA -->
<link rel="manifest" href="manifest-readonly.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ดูสถานะแม่พิมพ์">

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- ExcelJS: used only for the styled "Export Excel" output (borders, merged
     header, print/page setup) — SheetJS above stays for reading uploaded
     .xlsx files, since its free build can't write cell styling or page
     setup at all. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
:root{
  --font:'PSL Text','PSLText','Sarabun','Segoe UI',Arial,sans-serif;
  --bg:#f0f2f7;--bg2:#fff;--bg3:#f5f6fa;
  --surface:#e8ecf5;--surface2:#dde2ef;
  --border:rgba(50,70,140,.10);--border2:rgba(50,70,140,.18);
  --accent:#2563eb;--accent2:#1d4ed8;--accent-lt:#eff5ff;
  --text:#1a1f35;--text2:#505880;--text3:#9099bc;
  --green:#16a34a;--green-lt:#f0faf4;
  --red:#dc2626;--red-lt:#fff1f1;
  --amber:#b45309;--amber-lt:#fffbeb;
  --purple:#7c3aed;--purple-lt:#f5f3ff;
  --shadow-lg:0 4px 24px rgba(20,40,100,.13);
  --r:8px;--r2:12px;--r3:16px;
}
html[data-theme="dark"]{
  --bg:#0f1220;--bg2:#1b2032;--bg3:#20263a;
  --surface:#262c42;--surface2:#333a54;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --accent:#3b82f6;--accent2:#7fb0ff;--accent-lt:rgba(37,99,235,.18);
  --text:#e8ebf5;--text2:#b6bdda;--text3:#7b83a8;
  --green:#4ade80;--green-lt:rgba(22,163,74,.18);
  --red:#f87171;--red-lt:rgba(220,38,38,.18);
  --amber:#fbbf24;--amber-lt:rgba(180,83,9,.22);
  --purple:#a78bfa;--purple-lt:rgba(124,58,237,.20);
}
body{font-family:var(--font);font-size:15px;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .15s,color .15s}

/* TOPBAR */
.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 var(--border)}
.logo{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;color:var(--text);white-space:nowrap}
.logo svg{color:var(--accent)}
.mis-mark{font-size:40px;font-weight:700;color:var(--accent);line-height:1;letter-spacing:.5px;flex-shrink:0}
.mis-text{display:flex;flex-direction:column;line-height:1.3;font-weight:700}
.mis-sub{font-size:11px;font-weight:400;color:var(--text3);margin-top:1px}
.ro-badge{display:flex;align-items:center;gap:6px;padding:4px 12px;background:var(--accent-lt);color:var(--accent2);border-radius:20px;font-size:15px;font-weight:700;white-space:nowrap}
.topbar-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.meta-ts{font-size:15px;color:var(--text3);white-space:nowrap}
.icon-btn{width:36px;height:36px;border:1px solid var(--border2);background:var(--surface);border-radius:var(--r);display:flex;align-items:center;justify-content:center;color:var(--text2);cursor:pointer;transition:.15s;flex-shrink:0}
.login-toggle-btn{height:36px;padding:0 14px;border:1px solid var(--border2);background:var(--surface);border-radius:var(--r);display:flex;align-items:center;gap:7px;color:var(--text2);cursor:pointer;transition:.15s;flex-shrink:0;font-family:var(--font);font-size:15px;font-weight:600;white-space:nowrap}
.login-toggle-btn:hover,.login-toggle-btn.active{background:var(--accent-lt);border-color:var(--accent);color:var(--accent2)}
.login-popover{position:absolute;top:44px;right:0;width:240px;background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r2);box-shadow:var(--shadow-lg);padding:16px;z-index:80}
.login-popover.off{display:none}
.login-popover .lp-title{font-weight:700;font-size:15px;margin-bottom:2px}
.login-popover .lp-sub{font-size:15px;color:var(--text3);margin-bottom:12px}
.login-popover input{width:100%;padding:8px 10px;margin-bottom:8px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:15px;outline:none}
.login-popover input:focus{border-color:var(--accent)}
.login-popover button{width:100%;padding:8px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer}
.login-popover button:hover{background:var(--accent2)}
.login-popover .lp-err{color:var(--red);font-size:15px;margin-top:8px;min-height:14px}
@media(max-width:480px){
  .login-popover{position:fixed;top:60px;right:10px;left:10px;width:auto}
}
.icon-btn:hover{background:var(--surface2);color:var(--accent)}

/* TOOLBAR */
.toolbar{padding:11px 18px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:160px;position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-input{width:100%;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:15px;padding:8px 12px 8px 34px;outline:none;font-family:var(--font);transition:.15s}
.search-input::placeholder{color:var(--text3)}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-lt)}
.sel-drop{background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:15px;padding:8px 10px;outline:none;cursor:pointer;font-family:var(--font)}
.fmt-toggle{display:flex;background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r);overflow:hidden;flex-shrink:0}
.fmt-toggle button{padding:7px 14px;border:none;background:transparent;color:var(--text2);font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.12s}
.fmt-toggle button.on.pdf{background:var(--red);color:#fff}
.fmt-toggle button.on.xls{background:var(--green);color:#fff}
.tbar-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:1.5px solid;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font);transition:.15s;white-space:nowrap;background:var(--bg2)}
.tbar-btn.exp{color:var(--red);border-color:rgba(220,38,38,.28);background:var(--red-lt)}
.tbar-btn.exp.xls{color:var(--green);border-color:rgba(22,163,74,.28);background:var(--green-lt)}
.tbar-btn.line{color:var(--green);border-color:var(--green)}
.tbar-btn.line:hover{background:var(--green-lt)}
.tbar-btn:disabled{opacity:.4;cursor:not-allowed}

/* LINE TEXT PANEL */
.line-box{display:none;margin:0 18px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:12px 14px;font-size:15px;font-family:'Courier New',monospace;white-space:pre-wrap;line-height:1.6;color:var(--text)}
.line-box.on{display:block}
.line-actions{display:flex;gap:8px;margin-top:10px}
.line-copy-btn{padding:6px 14px;border-radius:6px;border:1.5px solid var(--green);background:var(--green-lt);color:var(--green);font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font)}

/* CONTENT */
.main{display:flex;flex:1;overflow:hidden;height:calc(100vh - 56px)}
.main{display:flex;flex:1;overflow:hidden;height:calc(100dvh - 56px)}
.content{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.tbl-wrap{flex:1;overflow:auto;background:var(--bg3)}

@media(min-width:769px){
  body.wide-table #dataTable{width:auto;min-width:0;table-layout:fixed}
}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:15px;min-width:760px}
thead{position:sticky;top:0;z-index:10;background:var(--bg2)}
thead tr{background:var(--bg2);border-bottom:2px solid var(--border2)}
/* ── FROZEN COLUMNS: stay put while swiping through the wide jobs table.
   Left offset is computed per-column in JS (renderTableHead/renderTable)
   since it depends on the sum of the preceding frozen columns' widths,
   which the admin-adjustable column-width feature can change at runtime. */
td.frz,th.frz{position:sticky;z-index:6;background:var(--bg2)}
th.frz{z-index:16;background:var(--bg2)}
tbody tr:nth-child(even) td.frz{background:var(--bg3)}
td.frz.frz-edge,th.frz.frz-edge{box-shadow:2px 0 6px rgba(20,40,100,.10)}
th{padding:13px 14px;text-align:center;font-size:15px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--text3);white-space:nowrap;font-family:var(--font)}
tbody tr{border-bottom:1px solid var(--border);background:var(--bg2);transition:background .08s}
tbody tr:nth-child(even){background:var(--bg3)}
tbody tr:hover{background:var(--accent-lt)!important}
td{padding:11px 14px;vertical-align:middle;text-align:center}
.chk{cursor:pointer}
.tc{font-family:'Courier New',monospace;font-size:15px;color:var(--accent2);font-weight:700;white-space:nowrap}
.tn{color:var(--text);line-height:1.45;max-width:420px;text-align:center}
.nm{font-size:15px;font-weight:500;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;font-size:15px;font-weight:700;letter-spacing:.4px;padding:2px 8px;border-radius:5px;background:var(--red-lt);color:var(--red);border:1.5px solid rgba(220,38,38,.20);white-space:nowrap;flex-shrink:0;line-height:1.4}
.tu{font-size:15px;color:var(--text2);white-space:nowrap;text-align:center}
.qb{display:inline-flex;align-items:center;justify-content:center;min-width:58px;padding:4px 12px;border-radius:6px;font-size:15px;font-weight:700;font-family:'Courier New',monospace;white-space:nowrap;line-height:1.3}
.q0{background:var(--red-lt);color:var(--red);border:1.5px solid rgba(220,38,38,.18)}
.ql{background:#fde047;color:#111827;border:1.5px solid rgba(0,0,0,.15)}
.qg{background:var(--green-lt);color:var(--green);border:1.5px solid rgba(22,163,74,.18)}
.qn{background:var(--surface);color:var(--text3);border:1.5px solid var(--border2)}
.qp{background:var(--purple-lt);color:var(--purple);border:1.5px solid rgba(124,58,237,.18)}
.td-date{font-size:15px;color:var(--text3);white-space:nowrap;font-family:'Courier New',monospace}
mark{background:rgba(37,99,235,.20);color:var(--accent2);border-radius:3px;padding:0 2px}

.empty{padding:70px 20px;text-align:center;color:var(--text3);background:var(--bg3)}
.empty svg{margin-bottom:13px;opacity:.3}
.empty .et{font-size:16px;font-weight:600;color:var(--text2);margin-bottom:7px}
.empty .es{font-size:15px;line-height:1.6}

.pager{padding:11px 18px;border-top:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pinfo{font-size:15px;color:var(--text2);flex:1}
.pinfo b{color:var(--text)}
.pbtns{display:flex;gap:3px}
.pb{background:var(--surface);border:1.5px solid var(--border2);color:var(--text2);font-size:15px;padding:5px 11px;border-radius:6px;cursor:pointer;font-family:var(--font);transition:.12s}
.pb:hover:not(:disabled){background:var(--surface2);color:var(--text)}
.pb.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.pb:disabled{opacity:.3;cursor:default}

.toast{position:fixed;bottom:20px;right:20px;z-index:999;background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r2);padding:12px 16px;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);transform:translateY(60px);opacity:0;transition:.26s;max-width:340px;color:var(--text)}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg3)}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px}

@media(max-width:768px){
  body{font-size:14px}
  .topbar{padding:0 10px;gap:6px}
  .mis-text{display:none}
  .mis-mark{font-size:22px}
  .ro-badge{padding:6px;border-radius:50%}
  .ro-badge span{display:none}
  .meta-ts{display:none}
  .topbar-r{gap:5px}
  .login-toggle-btn{width:36px;padding:0;justify-content:center}
  .login-toggle-btn span{display:none}
  .toolbar{padding:9px 12px;position:sticky;top:var(--sticky-h,56px);z-index:48}
  .search-input{font-size:16px;min-height:42px}
  .sel-drop{flex:1 1 100%;order:3;min-height:40px}
  .fmt-toggle button{padding:9px 12px;min-height:40px}
  .tbar-btn{padding:9px 12px;min-height:40px}

  /* TABLE -> compact stacked cards (generic label:value layout) */
  .tbl-wrap{overflow-x:hidden}
  table{min-width:0}
  thead{display:none}
  tbody,#dataTable{display:block;width:100%}
  tbody tr{display:block;padding:10px 12px;border-bottom:1px solid var(--border);position:relative}
  tbody tr:nth-child(even){background:var(--bg3)}
  td{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:3px 0;border:none;min-width:0;font-size:13px}
  td:first-child{position:absolute;top:10px;right:12px;padding:0}
  td:first-child::before{content:none}
  td::before{content:attr(data-label);color:var(--text3);font-size:11px;font-weight:600;flex-shrink:0;padding-top:1px}
  td .v{text-align:right;min-width:0}
  td.tc{font-family:'Courier New',monospace;color:var(--accent2);font-weight:700}
  td.tn{max-width:none}
  td.tn .v{flex:1;white-space:normal}
  tbody tr{padding-right:40px}

  /* TABLE -> compact single-line rows (used for the registry tab, whose
     fields are all short — real table layout, not stacked cards) */
  body.compact-mobile .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  body.compact-mobile table{min-width:0;width:max-content}
  body.compact-mobile thead{display:table-header-group;position:sticky;top:0;z-index:5}
  body.compact-mobile th{background:var(--bg2)}
  body.compact-mobile #dataTable{display:table;width:max-content}
  body.compact-mobile tbody{display:table-row-group}
  body.compact-mobile tbody tr{display:table-row;padding:0}
  body.compact-mobile th{padding:7px 9px;font-size:10.5px;white-space:nowrap;text-align:center}
  body.compact-mobile td{
    display:table-cell;
    padding:7px 9px;
    border:none;
    border-bottom:1px solid var(--border);
    font-size:12px;
    white-space:nowrap;
    text-align:center;
  }
  body.compact-mobile td:first-child{position:static;padding:7px 9px}
  body.compact-mobile td::before{content:none}
  body.compact-mobile td.tn{max-width:none;text-align:center;margin-left:0}
  body.compact-mobile .qb{min-width:0;padding:2px 8px;font-size:11px}

  .pager{padding:10px 12px}
  .pinfo{flex:1 1 100%;order:1;text-align:center;font-size:12.5px}
  .pbtns{order:2;flex:1;justify-content:center;flex-wrap:wrap}
  .pb{min-width:38px;min-height:38px}
}
</style>
</head>
<body class="wide-table">

<div class="topbar">
  <div class="logo">
    <span class="mis-mark">MIS</span>
    <div class="mis-text">
      <span>Management Information System</span>
      <span class="mis-sub">ระบบสารสนเทศเพื่อการจัดการ</span>
    </div>
  </div>
  <div class="ro-badge">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg><span>read only version</span>
  </div>
  <div class="topbar-r">
    <span class="meta-ts" id="metaTs"></span>
    <div class="icon-btn" onclick="loadData()" title="รีเฟรชข้อมูล">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
    </div>
    <div style="position:relative">
      <div class="login-toggle-btn" id="loginToggleBtn" onclick="toggleLoginBox()" title="เข้าสู่ระบบ (Validator / Data Specialist)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>เข้าสู่ระบบ</span>
      </div>
      <div id="loginPopover" class="login-popover off">
        <div class="lp-title">เข้าสู่ระบบ</div>
        <div class="lp-sub">สำหรับ Validator, Data Specialist และผู้สร้างรหัส ABS</div>
        <input type="text" id="lpUsername" placeholder="Username" autocomplete="off">
        <input type="password" id="lpPassword" placeholder="Password" autocomplete="off">
        <button onclick="doQuickLogin()">เข้าสู่ระบบ</button>
        <div class="lp-err" id="lpErr"></div>
      </div>
    </div>
    <div class="icon-btn" onclick="toggleTheme()" title="สลับธีม">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </div>
  </div>
</div>

<div class="main">
  <div class="content">
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="searchInput" type="text" placeholder="ค้นหารหัส รุ่น หรือรายละเอียด..." oninput="onFilter()" autocomplete="off">
      </div>
      <select class="sel-drop" id="groupFilter" onchange="onFilter()">
        <option value="">ทุกกลุ่ม</option>
      </select>
      <select class="sel-drop" id="categoryFilter" onchange="onFilter()">
        <option value="">ทุกหมวด</option>
      </select>
      <select class="sel-drop" id="stockFilter" onchange="onFilter()"></select>
      <div class="fmt-toggle" id="fmtToggle">
        <button class="on pdf" data-fmt="pdf" onclick="setFmt('pdf')">PDF</button>
        <button data-fmt="xls" onclick="setFmt('xls')">Excel</button>
      </div>
      <button class="tbar-btn exp" id="exportBtn" onclick="doExport()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span id="exportBtnLabel">Export PDF</span>
      </button>
      <button class="tbar-btn line" id="lineBtn" onclick="toggleLineBox()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span id="lineBtnLabel">คัดลอกข้อความ (0)</span>
      </button>
    </div>

    <div class="line-box" id="lineBox">

var FREEZE_COLUMNS=['group','category','model','code']; // default until admin sets otherwise
// No column is ever resized, shrunk or hidden to make freeze work — every
// column stays exactly the width set in "ปรับความกว้างคอลัมน์" at all
// times. That only works for ONE contiguous run of ticked "frozen"
// columns: if an unfrozen column were left sitting between two frozen
// ones, it would have nowhere to go as you scroll and would get crushed
// against its fixed-size neighbors. Columns ticked BEFORE that run starts
// are fine and never block it — they simply scroll away to the left
// normally before the frozen run needs to stick, so the run does NOT have
// to begin at the very first column. So: find the first column that's
// ticked frozen, pin it and every ticked column immediately after it
// while they stay consecutive; the moment a non-frozen column breaks that
// run, stop — any later ticked columns are left unpinned. Column order
// itself is never changed either.
function computeFreezeInfo(cols){
  var freezeLefts=[]; var acc=34; var frozenIdx=[]; var started=false; var broke=false;
  cols.forEach(function(c,i){
    var isFreeze = FREEZE_COLUMNS.indexOf(c.ck)>=0;
    if(!broke && isFreeze){
      started=true;
      freezeLefts.push(acc); acc+=(c.width||0); frozenIdx.push(i);
    } else {
      freezeLefts.push(null);
      if(started) broke=true;
    }
  });
  return { lefts: freezeLefts, lastIdx: frozenIdx.length?frozenIdx[frozenIdx.length-1]:-1 };
}
function styleAttrOf(align, frzLeft){
  var parts=[];

}

var ROLE_ROUTES = {

// TRIAL วันที่ — the UTC calendar date of the real-time submission moment
// (trialTs, an epoch-ms timestamp, is always UTC by nature regardless of
// the validator's own device timezone). Rows submitted before this field
// existed only have the older date-only trialDate, so those still fall
// back to that.
function fmtTrialDateTime(r){
  if(r && r.trialTs){
    var d=new Date(r.trialTs);
    var p=function(n){ return String(n).length<2?'0'+n:String(n); };
    return p(d.getUTCDate())+'/'+p(d.getUTCMonth()+1)+'/'+d.getUTCFullYear();
  }
  return (r&&r.trialDate)||'-';
}

// ══════════════════════════════════════════
// ── DATE-PICKER COLUMNS: colored countdown ("เหลือ/เกิน กี่วัน")
// ══════════════════════════════════════════
// Dates from the date-picker inputs are ISO "YYYY-MM-DD". Compared against
// today in UTC calendar days (not the viewer's local timezone) so everyone
// sees the same day count regardless of device.
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function parseISODateUTC(s){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||'').trim());
  if(!m) return null;
  var t=Date.UTC(+m[1],+m[2]-1,+m[3]);
  return isNaN(t)?null:t;
}
function todayUTCms(){
  var n=new Date();
  return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate());
}
function formatDateDMY(s){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||'').trim());
  return m?(m[3]+'/'+m[2]+'/'+m[1]):s;
}
function dateBadgeHtml(dateStr, row, doneKey, freezeKey){
  if(!dateStr) return '-';
  var t=parseISODateUTC(dateStr);
  if(t===null) return esc(dateStr); // legacy free-text value — shown as-is, no countdown
  var disp=formatDateDMY(dateStr);
  doneKey=doneKey||'protoSchedDone';
  freezeKey=freezeKey||'protoSchedFreezeDiff';
  // Once a data specialist marks this date "เสร็จแล้ว" (done), the badge
  // stops recomputing against today's date — it shows the day count exactly
  // as it was at the moment "เสร็จแล้ว" was turned on (the frozen diff),
  // in a plain/neutral color instead of the green/red countdown colors.
  // Date + countdown always render as two stacked lines — never one line
  // that only wraps once the column happens to be too narrow — so every
  // row in the table gets the same height regardless of which rows have
  // a countdown label and which don't.
  if(row && row[doneKey]){
    var fdiff=(typeof row[freezeKey]==='number')?row[freezeKey]:Math.round((t-todayUTCms())/86400000);
    var flabel = fdiff>0 ? ('เหลือ '+fdiff+' วัน') : (fdiff<0 ? ('เกิน '+(-fdiff)+' วัน') : 'ถึงกำหนดวันนี้');
    return '<span style="display:block;color:var(--text);font-weight:600">'+disp+'</span><span style="display:block;font-size:11px;color:var(--text3)">('+flabel+')</span>';
  }
  var diff=Math.round((t-todayUTCms())/86400000);
  if(diff>0) return '<span style="display:block;color:var(--green);font-weight:600">'+disp+'</span><span style="display:block;font-size:11px;color:var(--green)">(เหลือ '+diff+' วัน)</span>';
  return '<span style="display:block;color:var(--red);font-weight:600">'+disp+'</span><span style="display:block;font-size:11px;color:var(--red)">(เกิน '+(-diff)+' วัน)</span>';
}

// ── STICKY OFFSETS (measured, not hardcoded)
// The topbar/toolbar stack via position:sticky, and toolbar height changes
// with content (more filter dropdowns wrap to more rows), so a hardcoded
// px offset drifts out of sync and lets the sticky toolbar overlap the
// first row of data.
function syncStickyOffsets(){
  var topbar=document.querySelector('.topbar');
  var toolbar=document.querySelector('.toolbar');
  if(!topbar) return;
  var topbarH=topbar.offsetHeight;
  var toolbarH=toolbar?toolbar.offsetHeight:0;
  document.documentElement.style.setProperty('--topbar-h', topbarH+'px');
  document.documentElement.style.setProperty('--sticky-h', topbarH+'px');
  document.documentElement.style.setProperty('--thead-top-h', (topbarH+toolbarH)+'px');
}
window.addEventListener('load', syncStickyOffsets);
window.addEventListener('resize', syncStickyOffsets);
window.addEventListener('orientationchange', function(){ setTimeout(syncStickyOffsets, 250); });

// ── LOCAL CACHE (IndexedDB) — instant paint + offline fallback, refreshed live from Cloud
function idbOpen(cb){
  var req=indexedDB.open(IDB_NAME,1);
  req.onupgradeneeded=function(e){
    var db=e.target.result;
    if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
  };
  req.onsuccess=function(e){cb(null,e.target.result);};
  req.onerror=function(e){cb(e.target.error,null);};
}
function loadLocalCache(){
  ['jobs'].forEach(function(tab){
    idbOpen(function(err,db){
      if(err) return;
      var tx=db.transaction(IDB_STORE,'readonly');
      var st=tx.objectStore(IDB_STORE);
      var res={};
      var r1=st.get(tab+'_data'); r1.onsuccess=function(e){res.data=e.target.result;};
      var r2=st.get(tab+'_meta'); r2.onsuccess=function(e){res.meta=e.target.result;};
      tx.oncomplete=function(){
        db.close();
        if(res.data&&res.data.length){
          jobsData=tagRows(res.data);
          var m=res.meta||{};
          document.getElementById('metaTs').textContent=m.ts?('ข้อมูลจากแคช · '+new Date(m.ts).toLocaleString('th-TH')):'';
          selected=new Set(); page=1; buildCategoryOptions(); buildGroupOptions(); onFilter();
        }
      };
    });
  });
}
function cacheSave(tab,data,meta){
  idbOpen(function(err,db){
    if(err) return;
    var tx=db.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).put(data,tab+'_data');
    tx.objectStore(IDB_STORE).put(meta,tab+'_meta');
    tx.oncomplete=function(){db.close();};
  });
}

// ── AUTO SYNC — real-time listeners (see the Firebase module script below).
// Both collections are watched continuously from page load onward, whichever
// tab is showing. Whenever the admin pushes new data, Firestore notifies
// this listener automatically and the visible tab re-renders — no manual
// refresh needed. The refresh button still exists for a manual re-render,
// but the underlying data itself is always kept live.
var everGotJobs=false;
function onJobsUpdate(res){
  if(res.error){
    console.warn('jobs watch error',res.error);
    if(!everGotJobs) toast('เชื่อมต่อ Cloud (งานปัจจุบัน) ไม่สำเร็จ','err');
    return;
  }
  everGotJobs=true;
  jobsData=tagRows(res.data||[]);
  cacheSave('jobs',jobsData,{ts:res.ts});
  document.getElementById('metaTs').textContent=res.ts?('อัพเดตอัตโนมัติล่าสุด '+new Date(res.ts).toLocaleString('th-TH')):'';
  selected=new Set(); page=1; buildCategoryOptions(); buildGroupOptions(); onFilter();
}
function startAutoSync(){
  if(typeof window.fbWatchMoldJobs==='function') window.fbWatchMoldJobs(onJobsUpdate);
  if(typeof window.fbWatchColumnWidths==='function'){
    window.fbWatchColumnWidths(function(res){
      if(res && res.widths) applyColumnWidthsUnits(res.widths);
    });
  }
  if(typeof window.fbWatchFreezeColumns==='function'){
    window.fbWatchFreezeColumns(function(res){
      if(res && res.cks){
        FREEZE_COLUMNS=res.cks;
        if(activeTab==='jobs'){ renderTableHead(); onFilter(); }
      }
    });
  }
}
var COL_WIDTH_UNIT_TO_PX=7; // matches the scale used when the default widths were set
function applyColumnWidthsUnits(unitsObj){
  if(!unitsObj) return;
  TAB_CONFIG.jobs.columns.forEach(function(c){
    if(c.ck && unitsObj[c.ck]!==undefined){
      var u=Math.max(0,Math.min(100,Number(unitsObj[c.ck])||0));
      // Floor at 40px regardless of what's actually stored in Firestore —
      // a stale/bad 0 (or near-0) saved from before this was guarded at
      // save-time must not zero out (and effectively vanish) a column every
      // time this loads, since old data already in the database bypasses
      // the save-time guard entirely.
      c.width=Math.max(40,Math.round(u*COL_WIDTH_UNIT_TO_PX));
    }
  });
  if(activeTab==='jobs') renderTableHead();
}
// Manual refresh button: the data is already live via the listeners above,
// so this just re-applies the current filters against whatever has already
// arrived (useful if a render got out of sync for any reason).
function loadData(){
  buildCategoryOptions();
  buildGroupOptions();
  onFilter();
  toast('รีเฟรชแล้ว','ok');
}

// ── DYNAMIC UI (per tab)
function renderStatusOptions(){
  var sel=document.getElementById('stockFilter');
  sel.innerHTML=TAB_CONFIG[activeTab].statusOptions.map(function(o){return'<option value="'+o.value+'">'+o.label+'</option>';}).join('');
}
function renderTableHead(){
  var cols=TAB_CONFIG[activeTab].columns;
  var hasGroups=cols.some(function(c){return c.headerGroup;});

  document.getElementById('tblColgroup').innerHTML='<col style="width:34px">'+cols.map(function(c){
    return '<col style="width:'+(c.width||60)+'px">';
  }).join('');

  // table-layout:fixed + width:auto is unreliable for forcing a table wider
  // than its container across browsers — set an explicit pixel width so the
  // horizontal scrollbar in .tbl-wrap actually appears when columns are wide.
  // Desktop only: on mobile the table is a stacked-card list (display:block)
  // and .tbl-wrap hides horizontal overflow — an inline px width there would
  // push every value clean off the visible edge instead of stacking normally.
  var dt=document.getElementById('dataTable');
  if(window.innerWidth>768){
    // A single column with no width (or a width of 0, e.g. from a bad save
    // in "ปรับความกว้างคอลัมน์") must never collapse the WHOLE table into
    // fit-to-screen squeeze mode — fall back to a safe minimum for that one
    // column only, so every other column keeps its real configured width.
    var total=34+cols.reduce(function(a,c){return a+(c.width||60);},0);
    dt.style.width=total+'px';
  } else {
    dt.style.width='';
  }

  // Frozen columns (Excel-style "freeze panes"): the checkbox column is
  // always frozen at the far left, then whichever columns admin has chosen
  // (FREEZE_COLUMNS) stack immediately after it, in column order.
  var frzInfo=computeFreezeInfo(cols);
  var freezeLefts=frzInfo.lefts;
  function frzAttrs(c,i){
    if(freezeLefts[i]==null) return '';
    return ' class="frz'+(i===frzInfo.lastIdx?' frz-edge':'')+'"'+styleAttrOf('',freezeLefts[i]);
  }

  if(!hasGroups){
    var html='<tr><th rowspan="1" class="frz" style="left:0;width:34px"><input type="checkbox" class="chk" id="selAll" onclick="toggleSelAll(this)"></th>'
      +cols.map(function(c,i){
        var fa=frzAttrs(c,i);
        if(fa) return '<th'+fa+'>'+c.label+'</th>';
        var style=c.center?' style="text-align:center"':'';
        return '<th'+style+'>'+c.label+'</th>';
      }).join('')
      +'</tr>';
    document.getElementById('tblHead').innerHTML=html;
    return;
  }

  var row1=['<th rowspan="2" class="frz" style="left:0;width:34px"><input type="checkbox" class="chk" id="selAll" onclick="toggleSelAll(this)"></th>'];
  var row2=[];
  var i=0;
  while(i<cols.length){
    var c=cols[i];
    if(c.headerGroup){
      var span=0, g=c.headerGroup, startIdx=i;
      while(i<cols.length && cols[i].headerGroup===g){ span++; i++; }
      // A merged group header (colspan) only makes visual sense when ALL
      // its sub-columns share the same frozen state — its width comes from
      // the colspan (both sub-columns combined), so if only one side is
      // frozen, a single sticky title box would cover ground that includes
      // the still-scrolling side, overlapping whatever scrolls in after it.
      // So: fully frozen or fully unfrozen → keep the merged title; mixed →
      // fall back to two independent single-column headers instead.
      var frozenCount=0;
      for(var k=startIdx;k<i;k++){ if(freezeLefts[k]!=null) frozenCount++; }
      var allFrozen = frozenCount===span;
      var noneFrozen = frozenCount===0;
      if(allFrozen || noneFrozen){
        if(allFrozen){
          var groupEdge = (startIdx+span-1)===frzInfo.lastIdx;
          row1.push('<th colspan="'+span+'" class="frz'+(groupEdge?' frz-edge':'')+'"'+styleAttrOf('',freezeLefts[startIdx])+'>'+g+'</th>');
        } else {
          row1.push('<th colspan="'+span+'">'+g+'</th>');
        }
        for(var j=startIdx;j<i;j++){
          var sc=cols[j];
          var jfa=frzAttrs(sc,j);
          if(jfa) row2.push('<th'+jfa+'>'+sc.label+'</th>');
          else {
            var style=sc.center?' style="text-align:center"':'';
            row2.push('<th'+style+'>'+sc.label+'</th>');
          }
        }
      } else {
        for(var m=startIdx;m<i;m++){
          var mc=cols[m];
          var mfa=frzAttrs(mc,m);
          var mlbl=mc.dataLabel||(g+' '+mc.label);
          if(mfa) row1.push('<th rowspan="2"'+mfa+'>'+mlbl+'</th>');
          else {
            var mstyle=mc.center?' style="text-align:center"':'';
            row1.push('<th rowspan="2"'+mstyle+'>'+mlbl+'</th>');
          }
        }
      }
    } else {
      var fa=frzAttrs(c,i);
      if(fa){
        row1.push('<th rowspan="2"'+fa+'>'+c.label+'</th>');
      } else {
        var style2=c.center?' style="text-align:center"':'';
        row1.push('<th rowspan="2"'+style2+'>'+c.label+'</th>');
      }
      i++;
    }
  }
  document.getElementById('tblHead').innerHTML='<tr>'+row1.join('')+'</tr><tr>'+row2.join('')+'</tr>';
}

// ── FILTER
function onFilter(){
  var DB = jobsData;
  var tokens=document.getElementById('searchInput').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var f=document.getElementById('stockFilter').value;
  var cat=document.getElementById('categoryFilter').value;
  var grp=document.getElementById('groupFilter').value;
  var cfg=TAB_CONFIG[activeTab];
  var d=DB.slice();
  if(f!=='all') d=d.filter(function(r){return statusOf(r)===f;});
  if(cat) d=d.filter(function(r){return r.category===cat;});
  if(grp) d=d.filter(function(r){return r.group===grp;});
  if(tokens.length) d=d.filter(function(r){
    var hay=(cfg.searchGet(r)||'').toLowerCase();
    return tokens.every(function(t){return hay.includes(t);});
  });
  VIEW=d; page=1;
  renderTable(tokens); renderPager(); updateSelUI();
}
function hl(text,tokens){
  text=text||'';
  if(!tokens||!tokens.length||!text) return text;
  var pat=tokens.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}).join('|');
  return text.replace(new RegExp('('+pat+')','gi'),'<mark>$1</mark>');
}

function renderEmpty(){

function renderTable(tokens){

      +cols.map(function(c,i){
        var lbl=c.dataLabel||c.label;
        var frzCls = freezeLefts[i]!=null ? ' frz'+(i===frzInfoBody.lastIdx?' frz-edge':'') : '';
        var cls=' class="'+((c.tdClass||'')+frzCls).trim()+'"';
        var align=c.center?'text-align:center':'';
        var styleAttr=styleAttrOf(align, freezeLefts[i]);
        if(c.statusBadge) return '<td data-label="'+lbl+'"'+cls+styleAttr+'><span class="qb '+STATUS_CLASS[st]+'">'+STATUS_LABEL[st]+'</span></td>';
        if(c.trialBadge){
          var tr=(r.result||'').toLowerCase();

        }

        var val=c.get(r)||'';
        var titleAttr=c.titleAttr?(' title="'+String(val).replace(/"/g,'&quot;')+'"'):'';
        return '<td data-label="'+lbl+'"'+cls+styleAttr+titleAttr+'><span class="v">'+hl(val,tokens)+'</span></td>';
      }).join('');
    return '<tr>'+cells+'</tr>';
  }).join('');

function renderPager(){
  var total=VIEW.length;
  var pages=Math.max(1,Math.ceil(total/pageSize));
  var s=total?(page-1)*pageSize+1:0, e=Math.min(page*pageSize,total);
  var DB = jobsData;
  document.getElementById('pager').style.display=(DB.length&&total>0)?'':'none';
  document.getElementById('pInfo').innerHTML='แสดง <b>'+s.toLocaleString()+'–'+e.toLocaleString()+'</b> จาก <b>'+total.toLocaleString()+'</b> รายการ';
  var nums=[];
  if(pages<=7){for(var i=1;i<=pages;i++) nums.push(i);}
  else{nums.push(1);if(page>3)nums.push('…');for(var i=Math.max(2,page-1);i<=Math.min(pages-1,page+1);i++)nums.push(i);if(page<pages-2)nums.push('…');nums.push(pages);}
  var h='<button class="pb" onclick="goPage('+(page-1)+')" '+(page<=1?'disabled':'')+'>‹</button>';
  nums.forEach(function(n){if(n==='…')h+='<span class="pb" style="opacity:.4;cursor:default">…</span>';else h+='<button class="pb'+(n===page?' on':'')+'" onclick="goPage('+n+')">'+n+'</button>';});

  document.getElementById('pBtns').innerHTML=h;
}

function doExport(){

  if(fmt==='pdf') exportPDF(data); else exportExcel(data).catch(function(e){toast('Export Excel ล้มเหลว: '+e.message,'err');});

// Groups consecutive exportColumns that share the same headerGroup so the
// header can be built as 2 rows: a merged group-name row on top (e.g.
// "แม่พิมพ์" spanning วันที่/Location) and a sub-label row underneath —
// matching the uploaded jobs_tracking_form base. A column with no
// headerGroup instead spans both header rows vertically.
function buildExportHeaderGroups(colDefs){
  var groups=[]; var i=0;
  while(i<colDefs.length){
    var c=colDefs[i];
    if(c.headerGroup){
      var j=i; var run=[];
      while(j<colDefs.length && colDefs[j].headerGroup===c.headerGroup){ run.push(colDefs[j]); j++; }
      groups.push({grouped:true,label:c.headerGroup,cols:run});
      i=j;
    } else {
      groups.push({grouped:false,label:c.label,cols:[c]});
      i++;
    }
  }
  return groups;
}
async function exportExcel(data){
  var colDefs=TAB_CONFIG[activeTab].exportColumns;
  var groups=buildExportHeaderGroups(colDefs);

  var wb=new ExcelJS.Workbook();
  var ws=wb.addWorksheet(TAB_CONFIG[activeTab].reportTitle,{
    pageSetup:{
      orientation:'landscape',
      paperSize:9, // A4
      fitToPage:true, fitToWidth:1, fitToHeight:0,
      margins:{left:0.25,right:0.25,top:0.3,bottom:0.3,header:0.1,footer:0.1}
    }
  });
  ws.columns=colDefs.map(function(){return{width:16};});

  var HEADER_FILL={type:'pattern',pattern:'solid',fgColor:{argb:'FFD9E4F5'}};
  var THIN={style:'thin',color:{argb:'FF9099BC'}};
  var borderAll={top:THIN,left:THIN,bottom:THIN,right:THIN};

  ws.getRow(1).height=22; ws.getRow(2).height=20;
  var colIdx=1;
  groups.forEach(function(g){
    if(g.grouped){
      var start=colIdx, end=colIdx+g.cols.length-1;
      ws.mergeCells(1,start,1,end);
      ws.getRow(1).getCell(start).value=g.label;
      g.cols.forEach(function(c,k){
        ws.getRow(2).getCell(colIdx+k).value=c.subLabel||c.label;
      });
    } else {
      ws.mergeCells(1,colIdx,2,colIdx);
      ws.getRow(1).getCell(colIdx).value=g.label;
    }
    colIdx+=g.cols.length;
  });
  [1,2].forEach(function(rn){
    ws.getRow(rn).eachCell({includeEmpty:true},function(cell){
      cell.font={name:'Angsana New',size:16,bold:true};
      cell.alignment={vertical:'middle',horizontal:'center',wrapText:true};
      cell.fill=HEADER_FILL;
      cell.border=borderAll;
    });
  });

  data.forEach(function(r){
    var rowVals=colDefs.map(function(c){return c.get(r)||'';});
    var row=ws.addRow(rowVals);
    row.eachCell({includeEmpty:true},function(cell){
      cell.font={name:'Angsana New',size:16};
      cell.alignment={vertical:'middle',horizontal:'center'};
      cell.border=borderAll;
    });
  });

  ws.pageSetup.printTitlesRow='1:2';

  var buf=await wb.xlsx.writeBuffer();
  var blob=new Blob([buf],{type:'application/octet-stream'});
  var ts=new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=TAB_CONFIG[activeTab].filePrefix+'-export-'+ts+'.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast('Export Excel สำเร็จ '+data.length.toLocaleString()+' รายการ','ok');
}
function exportPDF(data){

  var thead='<tr>'+theadTop+'</tr>'+(theadBottom?'<tr>'+theadBottom+'</tr>':'');
  var tbody=data.map(function(r,i){

      if(c.label==='ผล TRIAL'){var tr=(r.result||'').toLowerCase();if(tr==='ok'||tr==='ng'){return'<td style="text-align:center"><span style="font-size:10px;font-weight:700;padding:1px 8px;border-radius:4px;background:#f5f6fa;color:'+STATUS_COLOR[tr]+';border:1px solid '+STATUS_COLOR[tr]+'33">'+STATUS_LABEL[tr]+'</span></td>';}return'<td></td>';}
      return'<td>'+(c.get(r)||'')+'</td>';
    }).join('');
    return'<tr style="'+rowStyle+'">'+cells+'</tr>';
  }).join('');
  var html='<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">'

    +'th,td{white-space:nowrap}' /* never auto-break text mid-word onto a new line — rows must read exactly as in the app */
    +'th{padding:7px 8px;text-align:center;color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}'

    +'<div class="h-right">จำนวน <b>'+data.length.toLocaleString()+'</b> รายการ</div></div>'
    +'<table><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table>'

  var w=window.open('','_blank','width=1100,height=750');

  w.document.write(html); w.document.close();
  toast('เปิด Print PDF สำเร็จ '+data.length.toLocaleString()+' รายการ','ok');
}

// ── LINE TEXT EXPORT
function toggleLineBox(){
