<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ตรวจสอบผล TRIAL — Validator</title>
<meta name="theme-color" content="#2563eb">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
:root{
  --font:'PSL Text','PSLText','Sarabun','Segoe UI',Arial,sans-serif;
  --bg:#f0f2f7;--bg2:#fff;--bg3:#f5f6fa;
  --surface:#e8ecf5;--surface2:#dde2ef;
  --border:rgba(50,70,140,.10);--border2:rgba(50,70,140,.18);
  --accent:#2563eb;--accent2:#1d4ed8;--accent-lt:#eff5ff;
  --text:#1a1f35;--text2:#505880;--text3:#9099bc;
  --green:#16a34a;--green-lt:#f0faf4;
  --red:#dc2626;--red-lt:#fff1f1;
  --amber:#b45309;--amber-lt:#fffbeb;
  --shadow-lg:0 4px 24px rgba(20,40,100,.13);
  --r:8px;--r2:12px;--r3:16px;
}
html[data-theme="dark"]{
  --bg:#0f1220;--bg2:#1b2032;--bg3:#20263a;
  --surface:#262c42;--surface2:#333a54;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --accent:#3b82f6;--accent2:#7fb0ff;--accent-lt:rgba(37,99,235,.18);
  --text:#e8ebf5;--text2:#b6bdda;--text3:#7b83a8;
  --green:#4ade80;--green-lt:rgba(22,163,74,.18);
  --red:#f87171;--red-lt:rgba(220,38,38,.18);
  --amber:#fbbf24;--amber-lt:rgba(180,83,9,.22);
}
body{font-family:var(--font);font-size:15px;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .15s,color .15s}

/* ── LOGIN SCREEN */
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:360px;background:var(--bg2);border-radius:var(--r3);box-shadow:var(--shadow-lg);padding:32px 28px;text-align:center}
.login-box h1{font-size:19px;margin-bottom:4px;color:var(--text)}
.login-box p{font-size:13px;color:var(--text3);margin-bottom:22px}
.login-box input{width:100%;padding:11px 14px;margin-bottom:12px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:14.5px;outline:none}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;padding:11px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-family:var(--font);font-size:14.5px;font-weight:600;cursor:pointer;margin-top:4px}
.login-box button:hover{background:var(--accent2)}
.login-err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

/* ── APP TOPBAR */
.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;flex:1;min-width:0}
.logo svg{flex-shrink:0;color:var(--accent)}
.who{font-size:12.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);flex-shrink:0}
.icon-btn:hover{background:var(--surface)}

.content{flex:1;padding:16px;max-width:760px;margin:0 auto;width:100%}

/* ── TOOLBAR (search/filter/sort + total count) */
.toolbar{padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1 1 220px;min-width:160px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.search-input{width:100%;padding:9px 12px 9px 34px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:14px;outline:none}
.search-input:focus{border-color:var(--accent)}
.sel-drop{background:var(--surface);border:1.5px solid var(--border2);border-radius:var(--r);color:var(--text);font-size:13px;padding:8px 10px;outline:none;cursor:pointer;font-family:var(--font)}
.count-badge{padding:8px 14px;border-radius:20px;background:var(--amber-lt);color:var(--amber);font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0;margin-left:auto}

/* ── PAGER */
.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 4px 4px;flex-wrap:wrap}
.pager .p-info{font-size:12.5px;color:var(--text3)}
.pager .p-btns{display:flex;gap:4px}
.pb{min-width:32px;height:32px;padding:0 8px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--surface);color:var(--text2);font-family:var(--font);font-size:13px;cursor:pointer}
.pb.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.pb:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:480px){
  .toolbar{padding:10px 12px}
  .count-badge{order:-1;margin-left:0;flex:1 1 100%;text-align:center}
}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty svg{margin-bottom:12px;opacity:.5}

/* ── PENDING CARD */
.card{background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r2);padding:16px;margin-bottom:14px}
.card-top{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:10px}
.card-top .f{font-size:13px}
.card-top .f b{color:var(--text3);font-weight:600;margin-right:4px}
.card-detail{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px}
.card-code{font-family:'Courier New',monospace;font-weight:700;color:var(--accent2);font-size:14px}
.card-meta{font-size:12.5px;color:var(--text3);margin-bottom:12px}
.hist-btn{font-size:12.5px;color:var(--accent);cursor:pointer;background:none;border:none;font-family:var(--font);padding:4px 0;text-decoration:underline}
.choice-row{display:flex;gap:8px;margin-top:12px}
.choice-btn{flex:1;padding:11px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--surface);color:var(--text2);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
.choice-btn.ok.on{background:var(--green-lt);border-color:var(--green);color:var(--green)}
.choice-btn.ng.on{background:var(--red-lt);border-color:var(--red);color:var(--red)}
.submit-btn{width:100%;margin-top:10px;padding:11px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer}
.submit-btn:hover{background:var(--accent2)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}

/* ── HISTORY MODAL */
.overlay{position:fixed;inset:0;background:rgba(10,15,35,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.overlay.off{display:none}
.modal-box{background:var(--bg2);border-radius:var(--r3);max-width:420px;width:100%;max-height:80vh;overflow-y:auto;padding:22px}
.modal-box h3{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal-box h3 .x{cursor:pointer;color:var(--text3);font-size:18px}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.hrow:last-child{border-bottom:none}
.hrow .badge{padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700}
.hrow .badge.ok{background:var(--green-lt);color:var(--green)}
.hrow .badge.ng{background:var(--red-lt);color:var(--red)}
.no-hist{text-align:center;color:var(--text3);font-size:13px;padding:20px 0}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg2);padding:10px 20px;border-radius:var(--r);font-size:13.5px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}

@media(max-width:480px){
  .content{padding:12px}
  .card{padding:13px}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <h1>ตรวจสอบผล TRIAL</h1>
    <p>สำหรับ Validator เท่านั้น</p>
    <input type="text" id="lUsername" placeholder="Username" autocomplete="off">
    <input type="password" id="lPassword" placeholder="Password" autocomplete="off">
    <button onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- APP SCREEN -->
<div id="appScreen" style="display:none;flex-direction:column;flex:1">
  <div class="topbar">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <div>
        <div>ตรวจสอบผล TRIAL</div>
        <div class="who" id="whoLabel"></div>
      </div>
    </div>
    <div class="icon-btn" onclick="toggleTheme()" title="โหมดกลางคืน">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </div>
    <div class="icon-btn" onclick="doLogout()" title="ออกจากระบบ">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
  </div>
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="ค้นหารหัส รุ่น หรือรายละเอียด..." oninput="page=1;renderList()" autocomplete="off">
    </div>
    <select class="sel-drop" id="groupFilterSel" onchange="page=1;renderList()">
      <option value="">ทุกกลุ่ม</option>
    </select>
    <select class="sel-drop" id="categoryFilterSel" onchange="page=1;renderList()">
      <option value="">ทุกหมวด</option>
    </select>
    <select class="sel-drop" id="sortSel" onchange="page=1;renderList()">
      <option value="">เรียง: ค่าเริ่มต้น</option>
      <option value="code-a">รหัส ก→ฮ</option>
      <option value="code-d">รหัส ฮ→ก</option>
      <option value="cat-a">หมวด ก→ฮ</option>
    </select>
    <div class="count-badge" id="countBadge">รอสรุปผล 0 รายการ</div>
  </div>
  <div class="content" id="content">
    <div class="empty" id="loadingMsg">กำลังโหลดข้อมูล...</div>
  </div>
  <div class="pager" id="pager" style="display:none;padding:0 16px 16px;max-width:760px;margin:0 auto;width:100%">
    <div class="p-info" id="pInfo"></div>
    <div class="p-btns" id="pBtns"></div>
  </div>
</div>

<!-- HISTORY MODAL -->
<div class="overlay off" id="ovHistory" onclick="if(event.target===this)closeHistory()">
  <div class="modal-box">
    <h3><span id="histTitle">ประวัติ TRIAL</span><span class="x" onclick="closeHistory()">✕</span></h3>
    <div id="histBody"></div>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script>
// ── THEME
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  var el=document.getElementById('themeIcon');
  if(el) el.innerHTML=t==='dark'
    ?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    :'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  try{localStorage.setItem('validator_theme',t);}catch(e){}
}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');}
(function(){try{applyTheme(localStorage.getItem('validator_theme')||'light');}catch(e){applyTheme('light');}})();

function toast(msg,type){
  var el=document.getElementById('toastEl');
  el.textContent=msg;
  el.className='toast show'+(type==='err'?' err':type==='ok'?' ok':'');
  clearTimeout(window._toastT);
  window._toastT=setTimeout(function(){el.classList.remove('show');},2600);
}

// ── SESSION
var SESSION_KEY='validator_session';
var session=null;
var jobsData=[];
var choices={}; // code -> 'ok'|'ng', pending local choice before submit
var page=1, pageSize=10;

function saveSession(s){ try{sessionStorage.setItem(SESSION_KEY, JSON.stringify(s));}catch(e){} }
function loadSession(){ try{return JSON.parse(sessionStorage.getItem(SESSION_KEY)||'null');}catch(e){return null;} }
function clearSession(){ try{sessionStorage.removeItem(SESSION_KEY);}catch(e){} }

function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='flex';
  document.getElementById('whoLabel').textContent='Validator: '+session.name;
  if(typeof window.fbWatchMoldJobs==='function') window.fbWatchMoldJobs(onJobsUpdate);
}

function doLogin(){
  var u=document.getElementById('lUsername').value.trim();
  var p=document.getElementById('lPassword').value;
  var errEl=document.getElementById('loginErr');
  errEl.textContent='';
  if(!u||!p){ errEl.textContent='กรอก Username และ Password'; return; }
  if(typeof window.fbSubUserLogin!=='function'){ errEl.textContent='ระบบยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง'; return; }
  window.fbSubUserLogin(u,p).then(function(res){
    if(!res){ errEl.textContent='Username หรือ Password ไม่ถูกต้อง'; return; }
    if(res.error){ errEl.textContent='เข้าสู่ระบบไม่สำเร็จ: '+(res.error.message||''); return; }
    if(res.role!=='validator'){ errEl.textContent='บัญชีนี้ไม่ใช่บัญชี Validator'; return; }
    session=res;
    saveSession(res);
    showApp();
  }).catch(function(err){
    errEl.textContent='เกิดข้อผิดพลาด: '+(err.message||'');
  });
}
function doLogout(){
  clearSession();
  window.location.href='readonly.html';
}

// ── DATA
function isPending(r){
  var res=(r.result||'').toLowerCase();
  if(res.indexOf('ng')>=0 || res==='ok') return false; // already resolved by a TRIAL
  // Enters the queue the moment a code exists and the mold is marked
  // complete — matches statusOfJobs()'s "pending" rule exactly in
  // dashboard-admin.html/readonly.html/data-specialist.html, so an item
  // reaching this stage shows up here automatically without anyone typing
  // "รอสรุปผล" by hand.
  return !!(r.code||'').trim() && !!(r.moldDone||'').trim();
}
function onJobsUpdate(res){
  if(res.error){ toast('โหลดข้อมูลไม่สำเร็จ: '+res.error.message,'err'); return; }
  jobsData=res.data||[];
  renderList();
}
function renderList(){
  var allPending=jobsData.filter(function(r){ return isPending(r) && (r.code||'').trim(); });
  document.getElementById('countBadge').textContent='รอสรุปผล '+allPending.length.toLocaleString()+' รายการ';
  buildFilterOptions(allPending);

  var q=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  var grp=document.getElementById('groupFilterSel').value;
  var cat=document.getElementById('categoryFilterSel').value;
  var sortV=document.getElementById('sortSel').value;

  var list=allPending.slice();
  if(grp) list=list.filter(function(r){return r.group===grp;});
  if(cat) list=list.filter(function(r){return r.category===cat;});
  if(q) list=list.filter(function(r){
    var hay=[r.code,r.model,r.item,r.detail].join(' ').toLowerCase();
    return hay.indexOf(q)>=0;
  });
  var sm={
    'code-a':function(a,b){return (a.code||'').localeCompare(b.code||'','th');},
    'code-d':function(a,b){return (b.code||'').localeCompare(a.code||'','th');},
    'cat-a':function(a,b){return (a.category||'').localeCompare(b.category||'','th');}
  };
  if(sm[sortV]) list.sort(sm[sortV]);

  var totalPages=Math.max(1,Math.ceil(list.length/pageSize));
  if(page>totalPages) page=totalPages;
  var slice=list.slice((page-1)*pageSize, page*pageSize);

  var el=document.getElementById('content');
  if(!allPending.length){
    el.innerHTML='<div class="empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><div>ไม่มีงานที่รอตรวจสอบตอนนี้</div></div>';
    document.getElementById('pager').style.display='none';
    return;
  }
  if(!slice.length){
    el.innerHTML='<div class="empty">ไม่พบรายการที่ตรงกับตัวกรอง</div>';
    document.getElementById('pager').style.display='none';
    return;
  }
  el.innerHTML=slice.map(function(r){
    var code=(r.code||'').trim();
    var okOn=choices[code]==='ok', ngOn=choices[code]==='ng';
    return '<div class="card">'
      +'<div class="card-top">'
        +'<span class="f"><b>กลุ่ม</b>'+esc(r.group||'-')+'</span>'
        +'<span class="f"><b>หมวด</b>'+esc(r.category||'-')+'</span>'
        +'<span class="f"><b>รุ่น</b>'+esc(r.model||'-')+'</span>'
      +'</div>'
      +'<div class="card-code">'+esc(code)+'</div>'
      +'<div class="card-detail">'+esc(r.detail||r.item||'-')+'</div>'
      +'<div class="card-meta">TRIAL ครั้งที่ล่าสุด: '+esc(r.trialRound||'-')+' · วันที่: '+esc(r.trialDate||'-')+'</div>'
      +'<button class="hist-btn" onclick="openHistory(\''+code.replace(/'/g,"\\'")+'\')">ดูประวัติ TRIAL ย้อนหลัง</button><br>'
      +'<a class="hist-btn" href="trial-checklist.html?code='+encodeURIComponent(code)+'" style="text-decoration:none;font-weight:700">📋 กรอกแบบฟอร์มตรวจสอบ TRIAL (740-FM-028)</a>'
      +'<div class="choice-row">'
        +'<button class="choice-btn ok'+(okOn?' on':'')+'" onclick="setChoice(\''+code.replace(/'/g,"\\'")+'\',\'ok\')">✓ OK</button>'
        +'<button class="choice-btn ng'+(ngOn?' on':'')+'" onclick="setChoice(\''+code.replace(/'/g,"\\'")+'\',\'ng\')">✕ NG</button>'
      +'</div>'
      +'<button class="submit-btn" id="submit-'+cssId(code)+'" '+(choices[code]?'':'disabled')+' onclick="submitResult(\''+code.replace(/'/g,"\\'")+'\')">ส่งผล TRIAL</button>'
    +'</div>';
  }).join('');

  renderPager(list.length, totalPages);
}
function buildFilterOptions(allPending){
  var grpSel=document.getElementById('groupFilterSel'), curGrp=grpSel.value;
  var gc={};allPending.forEach(function(r){if(r.group)gc[r.group]=(gc[r.group]||0)+1;});
  var gs=Object.entries(gc).sort(function(a,b){return b[1]-a[1];});
  grpSel.innerHTML='<option value="">ทุกกลุ่ม</option>'+gs.map(function(x){return'<option value="'+x[0]+'">'+x[0]+' ('+x[1]+')</option>';}).join('');
  grpSel.value=curGrp;

  var catSel=document.getElementById('categoryFilterSel'), curCat=catSel.value;
  var cc={};allPending.forEach(function(r){if(r.category)cc[r.category]=(cc[r.category]||0)+1;});
  var cs=Object.entries(cc).sort(function(a,b){return b[1]-a[1];});
  catSel.innerHTML='<option value="">ทุกหมวด</option>'+cs.map(function(x){return'<option value="'+x[0]+'">'+x[0]+' ('+x[1]+')</option>';}).join('');
  catSel.value=curCat;
}
function renderPager(total,pages){
  var s=total?(page-1)*pageSize+1:0, e=Math.min(page*pageSize,total);
  document.getElementById('pager').style.display=total>pageSize?'':'none';
  document.getElementById('pInfo').innerHTML='แสดง <b>'+s+'–'+e+'</b> จาก <b>'+total+'</b> รายการ';
  var nums=[];
  if(pages<=7){for(var i=1;i<=pages;i++) nums.push(i);}
  else{nums.push(1);if(page>3)nums.push('…');for(var i=Math.max(2,page-1);i<=Math.min(pages-1,page+1);i++)nums.push(i);if(page<pages-2)nums.push('…');nums.push(pages);}
  var h='<button class="pb" onclick="goPage('+(page-1)+')" '+(page<=1?'disabled':'')+'>‹</button>';
  nums.forEach(function(n){if(n==='…')h+='<span class="pb" style="opacity:.4;cursor:default;border:none">…</span>';else h+='<button class="pb'+(n===page?' on':'')+'" onclick="goPage('+n+')">'+n+'</button>';});
  h+='<button class="pb" onclick="goPage('+(page+1)+')" '+(page>=pages?'disabled':'')+'>›</button>';
  document.getElementById('pBtns').innerHTML=h;
}
function goPage(p){
  page=p; renderList();
  document.getElementById('content').scrollIntoView({behavior:'smooth',block:'start'});
}
function cssId(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g,'_'); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function setChoice(code,val){
  choices[code]=choices[code]===val?null:val;
  renderList();
}
function submitResult(code){
  var val=choices[code];
  if(!val) return;
  var btn=document.getElementById('submit-'+cssId(code));
  if(btn){ btn.disabled=true; btn.textContent='กำลังส่ง...'; }
  window.fbSubmitTrialResult(code, val, session.name).then(function(){
    delete choices[code];
    toast('ส่งผล TRIAL สำเร็จ','ok');
  }).catch(function(err){
    toast('ส่งผลไม่สำเร็จ: '+(err.message||''),'err');
    if(btn){ btn.disabled=false; btn.textContent='ส่งผล TRIAL'; }
  });
}

// ── HISTORY MODAL
function openHistory(code){
  document.getElementById('histTitle').textContent='ประวัติ TRIAL — '+code;
  document.getElementById('histBody').innerHTML='<div class="no-hist">กำลังโหลด...</div>';
  document.getElementById('ovHistory').classList.remove('off');
  if(typeof window.fbGetTrialHistory!=='function') return;
  window.fbGetTrialHistory(code).then(function(rounds){
    if(!rounds.length){
      document.getElementById('histBody').innerHTML='<div class="no-hist">ยังไม่มีประวัติ TRIAL</div>';
      return;
    }
    rounds.sort(function(a,b){return (b.round||0)-(a.round||0);});
    document.getElementById('histBody').innerHTML=rounds.map(function(r){
      return '<div class="hrow"><span>ครั้งที่ '+r.round+' · '+esc(r.date)+' · '+esc(r.validatedBy||'-')+'</span>'
        +'<span class="badge '+(r.result==='ok'?'ok':'ng')+'">'+(r.result==='ok'?'OK':'NG')+'</span></div>';
    }).join('');
  }).catch(function(err){
    document.getElementById('histBody').innerHTML='<div class="no-hist">โหลดไม่สำเร็จ: '+esc(err.message||'')+'</div>';
  });
}
function closeHistory(){ document.getElementById('ovHistory').classList.add('off'); }

// ── INIT: restore session if this browser tab already logged in.
// Called from the module script below (after it finishes setting up
// window.fbWatchMoldJobs etc.) rather than running immediately here —
// module scripts are deferred and execute after this classic script, so
// calling showApp() from this IIFE would run before fbWatchMoldJobs even
// exists yet, leaving the page stuck on "กำลังโหลดข้อมูล...".
function tryRestoreSession(){
  var s=loadSession();
  if(s && s.role==='validator'){ session=s; showApp(); }
}
</script>

<script type="module">
import { fbWatchMold, fbSubUserLogin, fbGetTrialHistory, fbSubmitTrialResult } from './firebase-mold-sync.js';
window.fbWatchMoldJobs = fbWatchMold;
window.fbSubUserLogin = fbSubUserLogin;
window.fbGetTrialHistory = fbGetTrialHistory;
window.fbSubmitTrialResult = fbSubmitTrialResult;
tryRestoreSession();
</script>
