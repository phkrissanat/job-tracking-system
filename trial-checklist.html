*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
:root{
  --font:'PSL Text','PSLText','Sarabun','Segoe UI',Arial,sans-serif;
  --bg:#f0f2f7;--bg2:#fff;--bg3:#f5f6fa;
  --surface:#e8ecf5;--surface2:#dde2ef;
  --border:rgba(50,70,140,.10);--border2:rgba(50,70,140,.18);
  --accent:#2563eb;--accent2:#1d4ed8;--accent-lt:#eff5ff;
  --text:#1a1f35;--text2:#505880;--text3:#9099bc;
  --green:#16a34a;--green-lt:#f0faf4;
  --red:#dc2626;--red-lt:#fff1f1;
  --amber:#b45309;--amber-lt:#fffbeb;
  --shadow-lg:0 4px 24px rgba(20,40,100,.13);
  --r:8px;--r2:12px;--r3:16px;
}
html[data-theme="dark"]{
  --bg:#0f1220;--bg2:#1b2032;--bg3:#20263a;
  --surface:#262c42;--surface2:#333a54;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --accent:#3b82f6;--accent2:#7fb0ff;--accent-lt:rgba(37,99,235,.18);
  --text:#e8ebf5;--text2:#b6bdda;--text3:#7b83a8;
  --green:#4ade80;--green-lt:rgba(22,163,74,.18);
  --red:#f87171;--red-lt:rgba(220,38,38,.18);
  --amber:#fbbf24;--amber-lt:rgba(180,83,9,.22);
}
body{font-family:var(--font);font-size:15px;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 var(--border)}
.back-btn{display:flex;align-items:center;gap:6px;color:var(--text2);text-decoration:none;font-size:13.5px;padding:8px 10px;border-radius:var(--r);flex-shrink:0}
.back-btn:hover{background:var(--surface)}
.topbar .title{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);flex-shrink:0}
.icon-btn:hover{background:var(--surface)}

.content{flex:1;padding:16px;max-width:880px;margin:0 auto;width:100%}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}

/* ── JOB INFO CARD */
.job-card{background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r2);padding:16px;margin-bottom:14px}
.job-card .code{font-family:'Courier New',monospace;font-weight:700;color:var(--accent2);font-size:15px}
.job-card .detail{font-size:14px;color:var(--text);margin-top:2px}
.job-card .meta{font-size:12.5px;color:var(--text3);margin-top:4px}

/* ── HEADER FORM FIELDS */
.header-box{background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r2);padding:16px;margin-bottom:14px}
.header-box h3{font-size:14px;margin-bottom:12px;color:var(--text)}
.field-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 12px}
.field-grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text2)}
.field-grid input{padding:8px 10px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13.5px}

/* ── SECTION / ITEM CARDS */
.section-card{background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r2);margin-bottom:12px;overflow:hidden}
.section-head{background:var(--surface);padding:10px 16px;font-weight:700;font-size:13.5px;color:var(--text);display:flex;align-items:center;gap:8px}
.section-head .no{color:var(--accent2)}
.section-note{font-size:11.5px;color:var(--text3);padding:0 16px 8px;font-weight:400}
.item-row{padding:12px 16px;border-top:1px solid var(--border)}
.item-row.sub{padding-left:32px;background:var(--bg3)}
.item-head{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
.item-no{font-weight:700;color:var(--accent2);font-size:12.5px;flex-shrink:0}
.item-desc{font-size:13.5px;color:var(--text);flex:1}
.item-meta{font-size:11.5px;color:var(--text3);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:10px}
.item-meta b{font-weight:600;color:var(--text2)}
.item-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.val-input{width:80px;padding:6px 8px;border-radius:6px;border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px}
.val-unit{font-size:12px;color:var(--text3)}
.okng-toggle{display:flex;gap:4px;margin-left:auto}
.okng-btn{padding:6px 12px;border-radius:6px;border:1.5px solid var(--border2);background:var(--surface);color:var(--text2);font-family:var(--font);font-size:12.5px;font-weight:700;cursor:pointer}
.okng-btn.ok.on{background:var(--green-lt);border-color:var(--green);color:var(--green)}
.okng-btn.ng.on{background:var(--red-lt);border-color:var(--red);color:var(--red)}

/* ── ACCESSORIES / SUMMARY / SIGNATURES */
.acc-row{display:flex;align-items:center;padding:9px 16px;border-top:1px solid var(--border);font-size:13.5px;gap:10px}
.acc-row .no{color:var(--text3);width:20px}
.acc-row .name{flex:1}
textarea.summary-input{width:100%;padding:10px 12px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13.5px;min-height:80px;resize:vertical}
.sig-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:10px}
.ts-row{display:flex;gap:8px;margin-bottom:8px}
.ts-btn{flex:1;padding:9px 12px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--surface);color:var(--text2);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer}
.ts-btn.on{background:var(--accent-lt);border-color:var(--accent);color:var(--accent2)}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.cc-item{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text)}
.cc-item input{width:16px;height:16px}
.sig-grid label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--text2);text-align:center}
.sig-grid input{padding:8px 10px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:13px;text-align:center}

/* ── PROGRESS + ACTIONS */
.progress-bar{position:sticky;bottom:0;background:var(--bg2);border-top:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 -2px 12px rgba(20,40,100,.08)}
.progress-info{font-size:12.5px;color:var(--text2);flex:1}
.progress-track{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:var(--accent);transition:width .2s}
.btn-save{padding:10px 18px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--surface);color:var(--text2);font-family:var(--font);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-complete{padding:10px 18px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-family:var(--font);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-complete:disabled{opacity:.45;cursor:not-allowed}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg2);padding:10px 20px;border-radius:var(--r);font-size:13.5px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}

@media(max-width:600px){
  .field-grid{grid-template-columns:1fr 1fr}
  .sig-grid{grid-template-columns:1fr}
  .content{padding:10px}
}

/* ── PRINT / PDF EXPORT ──────────────────────────────────────────────
   #printArea mirrors the original paper form (740-FM-028): a compact
   table with NO / รายการตรวจสอบ / เกณฑ์กำหนด / เครื่องมือวัด / ค่าที่วัดได้ / OK / NG
   columns, populated fresh from the current answers each time Export
   PDF is pressed. Hidden on screen; only @media print reveals it, and
   only it — everything else in the app is hidden while printing.
   The table uses a real <thead>, which browsers repeat on every printed
   page automatically, and every row is marked to never split across a
   page break — this is what the old version was missing entirely. */
#printArea{display:none}
.pf-page{font-family:'Sarabun','Segoe UI',Arial,sans-serif;color:#000;font-size:8px}
.pf-title{text-align:center;font-weight:700;font-size:13px;margin-bottom:1px}
.pf-modelline{text-align:center;font-size:9px;margin-bottom:4px}
.pf-fillin-box{border:1px solid #000;padding:3px 6px;margin-bottom:4px;font-size:8px}
.pf-fillin-line{padding:1px 0}
.pf-main-table{width:100%;border-collapse:collapse;font-size:7px;line-height:1.15;table-layout:fixed}
.pf-main-table col.c-no{width:3%}
.pf-main-table col.c-desc{width:36%}
.pf-main-table col.c-spec{width:20%}
.pf-main-table col.c-tool{width:13%}
.pf-main-table col.c-vall{width:9.5%}
.pf-main-table col.c-valr{width:9.5%}
.pf-main-table col.c-ok{width:4.5%}
.pf-main-table col.c-ng{width:4.5%}
.pf-main-table th,.pf-main-table td{border:1px solid #000;padding:0.5px 2px;vertical-align:middle}
.pf-main-table th{background:#e5e5e5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-weight:700;text-align:center}
.pf-main-table tr{page-break-inside:avoid;break-inside:avoid}
.pf-main-table td.pf-no{text-align:center;white-space:nowrap}
.pf-main-table td.pf-desc{text-align:left;overflow-wrap:break-word}
.pf-main-table td.pf-desc.pf-sub{padding-left:10px}
.pf-main-table td.pf-center{text-align:center;overflow-wrap:break-word}
.pf-main-table td.pf-lr-head{text-align:center;font-weight:700;background:#e5e5e5!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pf-section-row td{background:#f0f0f0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;font-weight:700;text-align:left;page-break-after:avoid;break-after:avoid}
.pf-okng{text-align:center;font-weight:700}
.pf-footer-block{page-break-inside:avoid;margin-top:4px}
.pf-footer-split{width:100%;border-collapse:collapse;table-layout:fixed}
.pf-footer-half{width:50%;vertical-align:top;padding:0 4px 0 0}
.pf-footer-hdr{font-weight:700;font-size:9px;text-align:center;margin-bottom:2px}
.pf-acc-table{width:100%;border-collapse:collapse;font-size:8px}
.pf-acc-table td{padding:1px 2px}
.pf-ts-table{width:100%;border-collapse:collapse;font-size:8px}
.pf-ts-table td{border:1px solid #000;padding:2px 4px}
.pf-cc-title{font-weight:700;font-size:9px;margin-top:4px;text-align:center}
.pf-cc-table{width:100%;border-collapse:collapse;font-size:8px}
.pf-cc-table td{padding:1px 4px;width:50%}
.pf-sig-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:8px}
.pf-sig-table td{border:1px solid #000;padding:12px 6px 4px;text-align:center;vertical-align:bottom;width:33.33%}
.pf-sig-table .pf-sig-name{border-bottom:1px solid #000;min-height:16px;margin-bottom:3px}
.pf-docno-br{text-align:right;font-size:7.5px;margin-top:2px}
@media print{
  body *{visibility:hidden}
  #printArea, #printArea *{visibility:visible}
  #printArea{display:block;position:absolute;top:0;left:0;width:100%}
  @page{size:A4 portrait;margin:8mm}
  thead{display:table-header-group}
  tr{page-break-inside:avoid}
}
</style>

// ── THEME
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  var el=document.getElementById('themeIcon');
  if(el) el.innerHTML=t==='dark'
    ?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    :'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  try{localStorage.setItem('validator_theme',t);}catch(e){}
}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');}
(function(){try{applyTheme(localStorage.getItem('validator_theme')||'light');}catch(e){applyTheme('light');}})();

function toast(msg,type){
  var el=document.getElementById('toastEl');
  el.textContent=msg;
  el.className='toast show'+(type==='err'?' err':type==='ok'?' ok':'');
  clearTimeout(window._toastT);
  window._toastT=setTimeout(function(){el.classList.remove('show');},2600);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

// ── STATE
var SESSION_KEY='validator_session';
var session=null;
var code='';
var round=1;
var jobRow=null;
var answers={}; // key -> {val, valL, valR, ok:bool, ng:bool}
var header={}; // free-text header fields
var accAnswers={}; // accessory index -> 'ok'|'ng'
var summaryText='';
var sigNames={engineer:'',reviewer:'',approver:''};
var trialSummary={result:'',disposition:'',retry:''};
var CC_ROLES=['กรรมการผู้จัดการ','ผู้จัดการโรงงาน','ผู้จัดการฝ่ายออกแบบฯ','ผู้จัดการฝ่ายผลิต','ผู้ช่วยผู้จัดการฝ่ายวางแผนการผลิต','ผู้ช่วยผู้จัดการฝ่ายคอมโพสิท'];
var ccList={};
var totalAnswerable=0;

function loadSession(){ try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){return null;} }

function init(){
  var s=loadSession();
  if(!s || s.role!=='validator'){
    window.location.href='validator.html';
    return;
  }
  session=s;
  var params=new URLSearchParams(window.location.search);
  code=(params.get('code')||'').trim();
  if(!code){
    document.getElementById('content').innerHTML='<div class="empty">ไม่พบรหัสชิ้นงานที่ระบุ — เปิดหน้านี้ผ่านปุ่มในหน้า Validator เท่านั้น</div>';
    return;
  }
  loadEverything();
}

function loadEverything(){
  if(typeof window.fbWatchMoldJobs!=='function' || typeof window.fbGetTrialHistory!=='function' || typeof window.fbGetTrialChecklist!=='function'){
    setTimeout(loadEverything, 100);
    return;
  }
  window.fbWatchMoldJobs(function(res){
    if(res.error) return;
    var row=(res.data||[]).find(function(r){ return (r.code||'').trim()===code; });
    if(row) jobRow=row;
  });
  window.fbGetTrialHistory(code).then(function(rounds){
    var maxRound=rounds.reduce(function(m,r){return Math.max(m,r.round||0);},0);
    round=maxRound+1;
    return window.fbGetTrialChecklist(code, round);
  }).then(function(existing){
    if(existing){
      answers=existing.answers||{};
      header=existing.header||{};
      accAnswers=existing.accAnswers||{};
      summaryText=existing.summary||'';
      sigNames=existing.signatures||sigNames;
      trialSummary=existing.trialSummary||trialSummary;
      ccList=existing.ccList||ccList;
    }
    render();
  }).catch(function(err){
    toast('โหลดข้อมูลไม่สำเร็จ: '+err.message,'err');
  });
}

// ── KEY ADDRESSING (position-based, since the source ISO document itself
// has a handful of duplicate item numbers from old numbering typos — the
// original 'no' label is only for display, never used as a lookup key)
function itemKey(si, ii, subi){
  return 's'+si+'-i'+ii+(subi!=null?('-sub'+subi):'');
}

function countAnswerable(){
  var n=0;
  TRIAL_CHECKLIST_TEMPLATE.forEach(function(s,si){
    s.items.forEach(function(it,ii){
      if(!it.groupOnly) n++;
      (it.sub||[]).forEach(function(){ n++; });
    });
  });
  return n + ACCESSORIES.length;
}

// ── RENDER
function render(){
  totalAnswerable = countAnswerable();
  var el=document.getElementById('content');
  var html='';
  html += renderJobCard();
  html += renderHeaderForm();
  TRIAL_CHECKLIST_TEMPLATE.forEach(function(s,si){ html += renderSection(s,si); });
  html += renderAccessories();
  html += renderSummaryAndSig();
  el.innerHTML = html;
  document.getElementById('progressBar').style.display='flex';
  updateProgress();
}

function renderJobCard(){
  var r=jobRow||{};
  return '<div class="job-card">'
    +'<div class="code">'+esc(code)+'</div>'
    +'<div class="detail">'+esc(r.detail||r.item||'-')+'</div>'
    +'<div class="meta">'+esc(r.group||'-')+' · '+esc(r.category||'-')+' · '+esc(r.model||'-')+' · TRIAL ครั้งที่ '+round+'</div>'
  +'</div>';
}

function renderHeaderForm(){
  var f=function(key,label,defVal){
    var v=header[key]!==undefined?header[key]:(defVal||'');
    return '<label>'+label+'<input type="text" data-hk="'+key+'" value="'+esc(v)+'" onchange="onHeaderChange(this)"></label>';
  };
  return '<div class="header-box">'
    +'<h3>ข้อมูลหัวเอกสาร</h3>'
    +'<div class="field-grid">'
      +f('roofModel','รุ่นหลังคา',jobRow?jobRow.model:'')
      +f('moldNo','พิมพ์ที่')
      +f('refDoc','เอกสารอ้างอิง')
      +f('scheduledDate','กำหนดการ TRIAL วันที่')
      +f('testDate','ดำเนินการทดสอบวันที่')
      +f('resultDate','สรุปผลการทดสอบวันที่')
    +'</div>'
  +'</div>';
}
function onHeaderChange(inp){ header[inp.getAttribute('data-hk')]=inp.value; }

function renderSection(s,si){
  var itemsHtml = s.items.map(function(it,ii){ return renderItem(it,si,ii); }).join('');
  return '<div class="section-card">'
    +'<div class="section-head"><span class="no">'+esc(s.no)+'.</span> '+esc(s.title)+'</div>'
    +(s.note?'<div class="section-note">'+esc(s.note)+'</div>':'')
    +itemsHtml
  +'</div>';
}

function renderItem(it,si,ii){
  if(it.groupOnly){
    // Label-only row that groups the sub-items below it — no input of its own
    var subHtml0 = (it.sub||[]).map(function(si2,k){ return renderLeaf(si2, itemKey(si,ii,k), true); }).join('');
    return '<div class="item-row"><div class="item-head"><span class="item-no">'+esc(it.no)+'</span><span class="item-desc">'+esc(it.desc)+'</span></div></div>'+subHtml0;
  }
  var ownHtml = renderLeaf(it, itemKey(si,ii), false);
  var subHtml = (it.sub||[]).map(function(si2,k){ return renderLeaf(si2, itemKey(si,ii,k), true); }).join('');
  return ownHtml + subHtml;
}

function renderLeaf(it, key, isSub){
  var a = answers[key] || {};
  var metaParts=[];
  if(it.spec) metaParts.push('<b>เกณฑ์</b> '+esc(it.spec));
  if(it.tool) metaParts.push('<b>เครื่องมือ</b> '+esc(it.tool));
  var valHtml='';
  if(it.type==='lr'){
    valHtml = '<input class="val-input" type="text" placeholder="ซ้าย" data-key="'+key+'" data-field="valL" value="'+esc(a.valL||'')+'" onchange="onValChange(this)">'
      +'<input class="val-input" type="text" placeholder="ขวา" data-key="'+key+'" data-field="valR" value="'+esc(a.valR||'')+'" onchange="onValChange(this)">'
      +(it.unit?'<span class="val-unit">'+esc(it.unit)+'</span>':'');
  } else if(it.type==='single'){
    valHtml = '<input class="val-input" type="text" placeholder="ค่าที่วัดได้" data-key="'+key+'" data-field="val" value="'+esc(a.val||'')+'" onchange="onValChange(this)">'
      +(it.unit?'<span class="val-unit">'+esc(it.unit)+'</span>':'');
  }
  return '<div class="item-row'+(isSub?' sub':'')+'">'
    +'<div class="item-head"><span class="item-no">'+esc(it.no)+'</span><span class="item-desc">'+esc(it.desc)+'</span></div>'
    +(metaParts.length?'<div class="item-meta">'+metaParts.join('')+'</div>':'')
    +'<div class="item-controls">'
      +valHtml
      +'<div class="okng-toggle">'
        +'<button class="okng-btn ok'+(a.ok?' on':'')+'" onclick="setOkNg(\''+key+'\',\'ok\')">OK</button>'
        +'<button class="okng-btn ng'+(a.ng?' on':'')+'" onclick="setOkNg(\''+key+'\',\'ng\')">NG</button>'
      +'</div>'
    +'</div>'
  +'</div>';
}

function onValChange(inp){
  var key=inp.getAttribute('data-key'), field=inp.getAttribute('data-field');
  if(!answers[key]) answers[key]={};
  answers[key][field]=inp.value;
}
function setOkNg(key,which){
  if(!answers[key]) answers[key]={};
  if(which==='ok'){ answers[key].ok=!answers[key].ok; if(answers[key].ok) answers[key].ng=false; }
  else { answers[key].ng=!answers[key].ng; if(answers[key].ng) answers[key].ok=false; }
  rerenderOneItem(key);
  updateProgress();
}
function rerenderOneItem(key){
  // Cheap full re-render keeps this simple and correct — the DOM for 143
  // items is small enough that this has no noticeable cost, and avoids
  // bugs from trying to patch just one button's classes by hand.
  render();
}

function renderAccessories(){
  var rows = ACCESSORIES.map(function(name,i){
    var v = accAnswers[i]||'';
    return '<div class="acc-row"><span class="no">'+(i+1)+'.</span><span class="name">'+esc(name)+'</span>'
      +'<div class="okng-toggle">'
        +'<button class="okng-btn ok'+(v==='ok'?' on':'')+'" onclick="setAccOkNg('+i+',\'ok\')">OK</button>'
        +'<button class="okng-btn ng'+(v==='ng'?' on':'')+'" onclick="setAccOkNg('+i+',\'ng\')">NG</button>'
      +'</div></div>';
  }).join('');
  return '<div class="section-card"><div class="section-head">อุปกรณ์ประกอบ</div>'+rows+'</div>';
}
function setAccOkNg(i,which){
  accAnswers[i]=accAnswers[i]===which?'':which;
  render();
  updateProgress();
}

  +'</div>';
}
function onSigChange(inp){ sigNames[inp.getAttribute('data-sig')]=inp.value; }
function setTrialSummary(field,val){
  trialSummary[field] = trialSummary[field]===val ? '' : val;
  render();
}
function toggleCc(i){ ccList[i]=!ccList[i]; render(); }

function updateProgress(){
  var answered=0;
  Object.keys(answers).forEach(function(k){ if(answers[k].ok||answers[k].ng) answered++; });
  Object.keys(accAnswers).forEach(function(k){ if(accAnswers[k]) answered++; });
  document.getElementById('progressText').textContent='ตรวจแล้ว '+answered+'/'+totalAnswerable+' จุด';
  document.getElementById('progressFill').style.width=(totalAnswerable?Math.round(answered/totalAnswerable*100):0)+'%';
  document.getElementById('btnComplete').disabled = answered<totalAnswerable;
}

function saveChecklist(markComplete){
  var answered=0;
  Object.keys(answers).forEach(function(k){ if(answers[k].ok||answers[k].ng) answered++; });
  Object.keys(accAnswers).forEach(function(k){ if(accAnswers[k]) answered++; });
  if(markComplete && answered<totalAnswerable){
    toast('กรอกให้ครบทุกจุดก่อน ('+answered+'/'+totalAnswerable+')','err');
    return;
  }
  var data={
    answers: answers, header: header, accAnswers: accAnswers,
    summary: summaryText, signatures: sigNames, trialSummary: trialSummary, ccList: ccList,
    completed: !!markComplete,
    savedBy: session.name
  };
  window.fbSaveTrialChecklist(code, round, data).then(function(){
    toast(markComplete?'บันทึกและยืนยันครบถ้วนแล้ว':'บันทึกร่างแล้ว','ok');
  }).catch(function(err){
    toast('บันทึกไม่สำเร็จ: '+err.message,'err');
  });
}

// ── EXPORT PDF (via browser print, formatted to mirror form 740-FM-028)
function pfEsc(s){ return esc(s); }
function pfOkNgCell(a){
  var okMark = a && a.ok ? '✓' : '';
  var ngMark = a && a.ng ? '✓' : '';
  return '<td class="pf-okng">'+okMark+'</td><td class="pf-okng">'+ngMark+'</td>';
}
// The "ค่าที่วัดได้" column is a single cell for most rows, but splits into
// L/R sub-columns for items with paired measurements — the table always
// has 8 physical columns (val-L + val-R) so this returns colspan="2" for
// the single case and two separate cells for the paired case, keeping
// every row's column count consistent.
function pfValCells(it, a){
  a = a || {};
  if(it.type==='lr'){
    return '<td class="pf-center">'+pfEsc(a.valL||'')+'</td><td class="pf-center">'+pfEsc(a.valR||'')+'</td>';
  }
  var txt = pfEsc(a.val||'')+(it.unit&&a.val?' '+pfEsc(it.unit):'');
  return '<td class="pf-center" colspan="2">'+txt+'</td>';
}
function pfHeaderTable(){
  var r=jobRow||{};
  var f=function(k,def){ return header[k]!==undefined?header[k]:(def||''); };
  return '<div class="pf-fillin-box">'
    +'<div class="pf-fillin-line">รุ่นหลังคา …'+pfEsc(f('roofModel',r.model))+'……....พิมพ์…....'+pfEsc(f('moldNo'))+'……...รหัส…….'+pfEsc(code)+'…....ทดสอบครั้งที่……..'+pfEsc(String(round))+'…......เอกสารอ้างอิง …………'+pfEsc(f('refDoc'))+'….</div>'
    +'<div class="pf-fillin-line">กำหนดการ TRIAL วันที่ '+pfEsc(f('scheduledDate'))+' ดำเนินการทดสอบวันที่ '+pfEsc(f('testDate'))+' สรุปผลการทดสอบ '+pfEsc(f('resultDate'))+'</div>'
  +'</div>';
}
function pfMainTable(){
  var colgroup='<colgroup><col class="c-no"><col class="c-desc"><col class="c-spec"><col class="c-tool"><col class="c-vall"><col class="c-valr"><col class="c-ok"><col class="c-ng"></colgroup>';
  var head='<thead><tr><th>NO.</th><th>หัวข้อรายการตรวจสอบ</th><th>เกณฑ์กำหนด</th><th>เครื่องมือวัด</th><th colspan="2">ค่าที่วัดได้</th><th>OK</th><th>NG</th></tr></thead>';
  var rows=[];
  TRIAL_CHECKLIST_TEMPLATE.forEach(function(s,si){
    // Matches the original: the section title sits in the item column of
    // its own row, and any qualifying note (e.g. a tolerance that applies
    // to the whole section) sits in the "เกณฑ์กำหนด" column of that SAME
    // row — it's not a separate merged banner row.
    rows.push('<tr class="pf-section-row"><td class="pf-no">'+pfEsc(s.no)+'</td><td class="pf-desc">'+pfEsc(s.title)+'</td>'
      +'<td class="pf-center">'+pfEsc(s.note||'')+'</td><td></td><td></td><td></td><td></td><td></td></tr>');
    s.items.forEach(function(it,ii){
      var key=itemKey(si,ii);
      var a=answers[key];
      if(it.groupOnly){
        rows.push('<tr><td class="pf-no">'+pfEsc(it.no)+'</td><td class="pf-desc">'+pfEsc(it.desc)+'</td>'
          +'<td class="pf-center">'+pfEsc(it.spec||'')+'</td><td class="pf-center">'+pfEsc(it.tool||'')+'</td>'
          +'<td class="pf-lr-head">L</td><td class="pf-lr-head">R</td><td></td><td></td></tr>');
      } else {
        rows.push('<tr><td class="pf-no">'+pfEsc(it.no)+'</td><td class="pf-desc">'+pfEsc(it.desc)+'</td>'
          +'<td class="pf-center">'+pfEsc(it.spec||'')+'</td><td class="pf-center">'+pfEsc(it.tool||'')+'</td>'
          +pfValCells(it,a)+pfOkNgCell(a)+'</tr>');
      }
      (it.sub||[]).forEach(function(si2,k){
        var skey=itemKey(si,ii,k);
        var sa=answers[skey];
        rows.push('<tr><td class="pf-no">'+pfEsc(si2.no)+'</td><td class="pf-desc pf-sub">'+pfEsc(si2.desc)+'</td>'
          +'<td class="pf-center">'+pfEsc(si2.spec||'')+'</td><td class="pf-center">'+pfEsc(si2.tool||'')+'</td>'
          +pfValCells(si2,sa)+pfOkNgCell(sa)+'</tr>');
      });
    });
  });
  return '<table class="pf-main-table">'+colgroup+head+'<tbody>'+rows.join('')+'</tbody></table>';
}
function pfAccessoriesTable(){
  // The original paper form has no OK/NG for accessories — just a plain
  // 2-column reference list. A checked ✓ is appended inline for anything
  // marked in the interactive form, without changing that layout.
  var cells=ACCESSORIES.map(function(name,i){
    var v=accAnswers[i]||'';
    var mark=v==='ok'?' ✓':(v==='ng'?' ✗':'');
    return (i+1)+' '+pfEsc(name)+mark;
  });
  var rows=['<tr><td>'+cells[0]+'</td><td>'+cells[3]+'</td></tr>',
            '<tr><td>'+cells[1]+'</td><td>'+cells[4]+'</td></tr>',
            '<tr><td>'+cells[2]+'</td><td>'+cells[5]+'</td></tr>'];
  return '<table class="pf-acc-table">'+rows.join('')+'</table>';
}
function pfTrialSummaryTable(){
  function chk(v,cur){ return cur===v ? '☑' : '☐'; }
  return '<table class="pf-ts-table"><tr>'
    +'<td>'+chk('ok',trialSummary.result)+'OK</td>'
    +'<td>'+chk('send',trialSummary.disposition)+'ส่งแม่พิมพ์สู่สายการผลิต</td>'
    +'<td>'+chk('yes',trialSummary.retry)+'แก้ไขทำการ TRIAL</td>'
  +'</tr><tr>'
    +'<td>'+chk('ng',trialSummary.result)+'NG</td>'
    +'<td>'+chk('return',trialSummary.disposition)+'ส่งแม่พิมพ์คืนฝ่ายออกแบบ</td>'
    +'<td>'+chk('no',trialSummary.retry)+'แก้ไขไม่ทำการ TRIAL</td>'
  +'</tr></table>'
  +(summaryText?('<div style="margin-top:2px;font-size:7.5px"><b>หมายเหตุ:</b> '+pfEsc(summaryText)+'</div>'):'');
}
function pfCcTable(){
  // Matches the original's column-major pairing: left column holds roles
  // 0-2, right column holds roles 3-5 — NOT sequential pairs.
  var rows=[0,1,2].map(function(i){
    return '<tr><td>'+(ccList[i]?'☑':'☐')+' '+pfEsc(CC_ROLES[i])+'</td>'
      +'<td>'+(ccList[i+3]?'☑':'☐')+' '+pfEsc(CC_ROLES[i+3])+'</td></tr>';
  });
  return '<div class="pf-cc-title">สำเนาเรียน</div><table class="pf-cc-table">'+rows.join('')+'</table>';
}
function pfSigTable(){
  return '<table class="pf-sig-table"><tr>'
      +'<td><div class="pf-sig-name">'+pfEsc(sigNames.engineer||'')+'</div>วิศวกร TRIAL / ออกเอกสาร</td>'
      +'<td><div class="pf-sig-name">'+pfEsc(sigNames.reviewer||'')+'</div>ห.น.ส่วนประกันคุณภาพ / ผู้ทบทวน</td>'
      +'<td><div class="pf-sig-name">'+pfEsc(sigNames.approver||'')+'</div>ผ.จก. ฝ่ายประกันคุณภาพ / ผู้อนุมัติ</td>'
    +'</tr></table>';
}
function exportPdf(){
  var r=jobRow||{};
  var html='<div class="pf-page">'
    +'<div class="pf-title">การ TRIAL ผลิตภัณฑ์ไฟเบอร์กลาส</div>'
    +'<div class="pf-modelline">รุ่น ……'+pfEsc(r.model||'')+'……………..</div>'
    +pfHeaderTable()
    +pfMainTable()
    +'<div class="pf-footer-block">'
      +'<table class="pf-footer-split"><tr>'
        +'<td class="pf-footer-half">'
          +'<div class="pf-footer-hdr">อุปกรณ์ประกอบ</div>'+pfAccessoriesTable()
        +'</td>'
        +'<td class="pf-footer-half">'
          +'<div class="pf-footer-hdr">สรุปผลการ TRIAL</div>'+pfTrialSummaryTable()
        +'</td>'
      +'</tr></table>'
      +pfCcTable()
      +pfSigTable()
      +'<div class="pf-docno-br">740-FM-028-REV.07</div>'
    +'</div>'
  +'</div>';
  document.getElementById('printArea').innerHTML=html;
  setTimeout(function(){ window.print(); }, 60);
}

init();

</script>
