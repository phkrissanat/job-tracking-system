<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>สร้างรหัส ABS — Item Creator</title>
<meta name="theme-color" content="#2563eb">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100vw}
:root{
  --font:'PSL Text','PSLText','Sarabun','Segoe UI',Arial,sans-serif;
  --bg:#f0f2f7;--bg2:#fff;--bg3:#f5f6fa;
  --surface:#e8ecf5;--surface2:#dde2ef;
  --border:rgba(50,70,140,.10);--border2:rgba(50,70,140,.18);
  --accent:#2563eb;--accent2:#1d4ed8;--accent-lt:#eff5ff;
  --text:#1a1f35;--text2:#505880;--text3:#9099bc;
  --green:#16a34a;--green-lt:#f0faf4;
  --red:#dc2626;--red-lt:#fff1f1;
  --amber:#b45309;--amber-lt:#fffbeb;
  --shadow-lg:0 4px 24px rgba(20,40,100,.13);
  --r:8px;--r2:12px;--r3:16px;
}
html[data-theme="dark"]{
  --bg:#0f1220;--bg2:#1b2032;--bg3:#20263a;
  --surface:#262c42;--surface2:#333a54;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --accent:#3b82f6;--accent2:#7fb0ff;--accent-lt:rgba(37,99,235,.18);
  --text:#e8ebf5;--text2:#b6bdda;--text3:#7b83a8;
  --green:#4ade80;--green-lt:rgba(22,163,74,.18);
  --red:#f87171;--red-lt:rgba(220,38,38,.18);
  --amber:#fbbf24;--amber-lt:rgba(180,83,9,.22);
}
body{font-family:var(--font);font-size:15px;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;transition:background .15s,color .15s}

.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:360px;background:var(--bg2);border-radius:var(--r3);box-shadow:var(--shadow-lg);padding:32px 28px;text-align:center}
.login-box h1{font-size:19px;margin-bottom:4px}
.login-box p{font-size:13px;color:var(--text3);margin-bottom:22px}
.login-box input{width:100%;padding:11px 14px;margin-bottom:12px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:14.5px;outline:none}
.login-box input:focus{border-color:var(--accent)}
.login-box button{width:100%;padding:11px;border-radius:var(--r);border:none;background:var(--accent);color:#fff;font-family:var(--font);font-size:14.5px;font-weight:600;cursor:pointer;margin-top:4px}
.login-box button:hover{background:var(--accent2)}
.login-err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

.topbar{height:56px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 var(--border)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;flex:1;min-width:0}
.logo svg{flex-shrink:0;color:var(--accent)}
.who{font-size:12.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text2);flex-shrink:0}
.icon-btn:hover{background:var(--surface)}

.content{flex:1;padding:16px;max-width:520px;margin:0 auto;width:100%}

.form-box{background:var(--bg2);border:1.5px solid var(--border2);border-radius:var(--r2);padding:22px;margin-top:8px}
.form-box h2{font-size:16px;margin-bottom:4px}
.form-box .hint{font-size:12.5px;color:var(--text3);margin-bottom:18px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--text2);font-weight:600}
.field input{padding:10px 12px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--surface);color:var(--text);font-family:var(--font);font-size:14.5px;outline:none}
.field input:focus{border-color:var(--accent)}
.btn-submit{width:100%;padding:12px;border-radius:var(--r);border:none;background:var(--green);color:#fff;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.btn-submit:hover{background:#15803d}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}

.recent{margin-top:20px}
.recent h3{font-size:13px;color:var(--text3);margin-bottom:8px;font-weight:600}
.recent-item{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;background:var(--bg3);border-radius:var(--r);font-size:13px;margin-bottom:6px}
.recent-item .code{font-family:'Courier New',monospace;font-weight:700;color:var(--accent2)}
.recent-item .name{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:right}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg2);padding:10px 20px;border-radius:var(--r);font-size:13.5px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.toast.err{background:var(--red)}
.toast.ok{background:var(--green)}
</style>
</head>
<body>

<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <h1>สร้างรหัส ABS</h1>
    <p>สำหรับผู้สร้างรหัส ABS เท่านั้น</p>
    <input type="text" id="lUsername" placeholder="Username" autocomplete="off">
    <input type="password" id="lPassword" placeholder="Password" autocomplete="off">
    <button onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<div id="appScreen" style="display:none;flex-direction:column;flex:1">
  <div class="topbar">
    <div class="logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <div>
        <div>สร้างรหัส ABS</div>
        <div class="who" id="whoLabel"></div>
      </div>
    </div>
    <div class="icon-btn" onclick="toggleTheme()" title="โหมดกลางคืน">
      <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </div>
    <div class="icon-btn" onclick="doLogout()" title="ออกจากระบบ">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
  </div>

  <div class="content">
    <div class="form-box">
      <h2>สร้างรหัส ABS ใหม่</h2>
      <div class="hint">เข้าระบบเป็นงานใหม่ (ยังไม่เริ่ม) — สถานะจะเปลี่ยนเป็น OK เองเมื่อผ่าน TRIAL ไม่ต้องตั้งสถานะเอง</div>

      <div class="field">
        <label>รหัส</label>
        <input type="text" id="absCode" placeholder="เช่น ABS-000-001-L" autocomplete="off">
      </div>
      <div class="field">
        <label>กลุ่ม</label>
        <input type="text" id="absGroup" placeholder="เช่น cargobox" autocomplete="off">
      </div>
      <div class="field">
        <label>หมวด</label>
        <input type="text" id="absCategory" placeholder="เช่น ตู้แห้ง/ตู้เย็น" autocomplete="off">
      </div>
      <div class="field">
        <label>ชื่อสินค้า</label>
        <input type="text" id="absItem" placeholder="ชื่อสินค้า" autocomplete="off">
      </div>
      <button class="btn-submit" id="submitBtn" onclick="submitItem()">+ สร้างรหัส</button>
    </div>

    <div class="recent" id="recentBox" style="display:none">
      <h3>สร้างล่าสุดในเซสชันนี้</h3>
      <div id="recentList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script>
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  var el=document.getElementById('themeIcon');
  if(el) el.innerHTML=t==='dark'
    ?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    :'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
  try{localStorage.setItem('itemcreator_theme',t);}catch(e){}
}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');}
(function(){try{applyTheme(localStorage.getItem('itemcreator_theme')||'light');}catch(e){applyTheme('light');}})();

function toast(msg,type){
  var el=document.getElementById('toastEl');
  el.textContent=msg;
  el.className='toast show'+(type==='err'?' err':type==='ok'?' ok':'');
  clearTimeout(window._toastT);
  window._toastT=setTimeout(function(){el.classList.remove('show');},2600);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

// ── SESSION (same pattern as validator.html / data-specialist.html)
var SESSION_KEY='itemcreator_session';
var session=null;
var jobsData=[]; // kept live via fbWatchMoldJobs, used only for the duplicate-code check below
var recentlyCreated=[];

function saveSession(s){ try{localStorage.setItem(SESSION_KEY, JSON.stringify(s));}catch(e){} }
function loadSession(){ try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){return null;} }
function clearSession(){ try{localStorage.removeItem(SESSION_KEY);}catch(e){} }

function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='flex';
  document.getElementById('whoLabel').textContent='ผู้สร้างรหัส ABS: '+session.name;
  if(typeof window.fbWatchMoldJobs==='function') window.fbWatchMoldJobs(onJobsUpdate);
}
function doLogin(){
  var u=document.getElementById('lUsername').value.trim();
  var p=document.getElementById('lPassword').value;
  var errEl=document.getElementById('loginErr');
  errEl.textContent='';
  if(!u||!p){ errEl.textContent='กรอก Username และ Password'; return; }
  if(typeof window.fbSubUserLogin!=='function'){ errEl.textContent='ระบบยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง'; return; }
  window.fbSubUserLogin(u,p).then(function(res){
    if(!res){ errEl.textContent='Username หรือ Password ไม่ถูกต้อง'; return; }
    if(res.error){ errEl.textContent='เข้าสู่ระบบไม่สำเร็จ: '+(res.error.message||''); return; }
    if(res.role!=='itemCreator'){ errEl.textContent='บัญชีนี้ไม่ใช่บัญชีผู้สร้างรหัส ABS'; return; }
    session=res;
    saveSession(res);
    showApp();
  }).catch(function(err){
    errEl.textContent='เกิดข้อผิดพลาด: '+(err.message||'');
  });
}
function doLogout(){ clearSession(); window.location.href='readonly.html'; }

function onJobsUpdate(res){
  if(res.error){ toast('โหลดข้อมูลไม่สำเร็จ (ระบบตรวจรหัสซ้ำอาจไม่ทำงาน): '+res.error.message,'err'); return; }
  jobsData=res.data||[];
}

// ── CREATE ITEM
// Always writes into mold_sync via fbAddJobRow, which only appends/extends
// a chunk — it never rewrites unrelated rows, so this is safe to use from
// a page with no view of the rest of the dataset. No status field is set on
// purpose: Job Tracking's own derived status (ยังไม่เริ่ม until proto/mold
// work starts, OK once TRIAL passes) already matches ABS's new/pending ->
// active lifecycle.
function submitItem(){
  var code=document.getElementById('absCode').value.trim();
  var group=document.getElementById('absGroup').value.trim();
  var category=document.getElementById('absCategory').value.trim();
  var item=document.getElementById('absItem').value.trim();

  if(!code){ toast('กรอกรหัสก่อน','err'); return; }
  if(!item){ toast('กรอกชื่อสินค้าก่อน','err'); return; }

  if(typeof window.fbAddJobRow!=='function') return;
  var btn=document.getElementById('submitBtn');
  btn.disabled=true;

  var dup=jobsData.find(function(r){ return (r.code||'').trim()===code; });
  if(dup && !confirm('รหัส "'+code+'" มีอยู่แล้ว ('+(dup.item||dup.detail||'')+') ต้องการสร้างซ้ำหรือไม่?')){
    btn.disabled=false;
    return;
  }

  window.fbAddJobRow({ code:code, group:group, category:category, item:item }).then(function(){
    btn.disabled=false;
    toast('สร้างรหัส '+code+' แล้ว','ok');
    recentlyCreated.unshift({ code:code, item:item });
    renderRecent();
    document.getElementById('absCode').value='';
    document.getElementById('absGroup').value='';
    document.getElementById('absCategory').value='';
    document.getElementById('absItem').value='';
    document.getElementById('absCode').focus();
  }).catch(function(err){
    btn.disabled=false;
    toast('สร้างไม่สำเร็จ: '+(err&&err.message||''),'err');
  });
}
function renderRecent(){
  if(!recentlyCreated.length) return;
  document.getElementById('recentBox').style.display='block';
  document.getElementById('recentList').innerHTML=recentlyCreated.slice(0,8).map(function(r){
    return '<div class="recent-item"><span class="code">'+esc(r.code)+'</span><span class="name">'+esc(r.item)+'</span></div>';
  }).join('');
}

// ── INIT
(function tryRestoreSession(){
  var s=loadSession();
  if(s && s.role==='itemCreator'){ session=s; showApp(); }
})();
</script>

<script type="module">
import { fbWatchMold, fbSubUserLogin, fbAddJobRow } from './firebase-mold-sync.js';
window.fbWatchMoldJobs = fbWatchMold;
window.fbSubUserLogin = fbSubUserLogin;
window.fbAddJobRow = fbAddJobRow;
</script>

</body>
</html>
